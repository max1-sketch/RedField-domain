<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --panel: #141722;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; background: var(--bg-0); color: var(--ink);
  font-family: 'Inter', sans-serif; font-size: 14px;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
a { color: inherit; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { position: fixed; top: 0; left: 0; right: 0; background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.card {
  width: 380px; max-width: 100%;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 36px 30px; text-align: center;
}
.icon { font-size: 34px; margin-bottom: 12px; }
.eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.brand { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0 0 4px; }
.sub { font-size: 12.5px; color: var(--muted); margin: 0 0 24px; line-height: 1.6; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; box-sizing: border-box;
  background: var(--accent); color: #0a0c11; font-weight: 700;
  padding: 12px; border-radius: 8px; text-decoration: none; font-size: 13.5px;
}
.btn:hover { opacity: .92; }
.btn-ghost {
  display: block; margin-top: 10px; font-size: 12px; color: var(--faint); text-decoration: none;
}
.btn-ghost:hover { color: var(--muted); }
.warn-banner { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; border-radius: 8px; padding: 10px 12px; font-size: 12px; font-weight: 600; text-align: left; line-height: 1.5; margin-bottom: 16px; }
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="card">
  <div class="icon">🚧</div>
  <p class="eyebrow">Member Portal</p>
  <p class="brand">{{SITE_TITLE}}</p>
  <div id="warnBanner"></div>
  <p class="sub">The member area for regular users isn't ready yet. If you were trying to view a ticket transcript, use the link sent to your DMs when the ticket closed — that works regardless of this page.</p>
  <a class="btn" href="/login">Back to sign-in</a>
  <a class="btn-ghost" href="/logout">Log out</a>
</div>

<script>
  if (new URLSearchParams(window.location.search).get('notStaff') === '1') {
    document.getElementById('warnBanner').innerHTML = `<div class="warn-banner">⚠️ Your Discord account isn't recognized as staff on this server, so the dashboard isn't available to you. If you believe this is a mistake, contact an Administrator.</div>`;
  }
</script>

</body>
</html>
