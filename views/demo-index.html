<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — Ticket Archive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #d69a4e;
    --bg-0: #0a0c11;
    --sidebar-bg: #0d0f16;
    --panel: #141722;
    --panel-2: #1a1e2b;
    --border: #262b3a;
    --ink: #e7e9ee;
    --muted: #9199a8;
    --faint: #5b6272;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
  .sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
  nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; transition: background .15s, color .15s; }
  .nav-item:hover { background: var(--panel-2); color: var(--ink); }
  .nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }

  .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }

  .content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1200px; }

  .art-hero-container {
    background: linear-gradient(135deg, rgba(20, 23, 34, 0.95), rgba(13, 15, 22, 0.98));
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 32px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .art-canvas-wrap { width: 85px; height: 85px; position: relative; flex-shrink: 0; }
  .cyber-core { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; perspective: 600px; }
  .core-ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(245, 158, 11, 0.4); pointer-events: none; }
  .ring-1 { width: 85px; height: 85px; animation: spinClockwise 12s linear infinite; }
  .ring-2 { width: 105px; height: 105px; border-style: dotted; border-color: rgba(245, 158, 11, 0.2); animation: spinCounter 16s linear infinite; }
  @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
  @keyframes spinCounter { 100% { transform: rotate(-360deg); } }

  .cube-3d { width: 48px; height: 48px; position: relative; transform-style: preserve-3d; animation: rotate3dCube 7s infinite linear; }
  .cube-face { position: absolute; width: 48px; height: 48px; border: 1.5px solid var(--accent); background: rgba(245, 158, 11, 0.12); box-shadow: 0 0 12px rgba(245, 158, 11, 0.25) inset; border-radius: 6px; }
  .cube-face.front  { transform: rotateY(0deg) translateZ(24px); }
  .cube-face.back   { transform: rotateY(180deg) translateZ(24px); }
  .cube-face.right  { transform: rotateY(90deg) translateZ(24px); }
  .cube-face.left   { transform: rotateY(-90deg) translateZ(24px); }
  .cube-face.top    { transform: rotateX(90deg) translateZ(24px); }
  .cube-face.bottom { transform: rotateX(-90deg) translateZ(24px); }
  @keyframes rotate3dCube { 0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); } }

  .hero-text-wrap { z-index: 1; }
  .system-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #22c55e; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.25); padding: 2px 8px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-pulse { width: 6px; height: 6px; border-radius: 50%; background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }

  .bot-3d-title { font-size: 30px; font-weight: 900; margin: 0 0 6px; color: var(--ink); letter-spacing: -0.02em; }
  .bot-credits { font-size: 13.5px; color: var(--muted); margin: 0; font-weight: 500; }
  .creator-tag { color: #fbbf24; font-weight: 800; background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.08)); border: 1px solid rgba(245, 158, 11, 0.4); padding: 3px 10px; border-radius: 20px; display: inline-block; margin-left: 4px; }

  .controls-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-input { flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--border); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 13.5px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr:last-child td { border-bottom: none; }
  
  .btn-view { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div class="site-banner">📢 TEST DEMO ENVIRONMENT — ALL DATA SET TO TEST</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>TEST PORTAL</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono">session TEST:TEST</span>
      <a href="#" class="nav-item">Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <div class="art-hero-container">
      <div class="art-canvas-wrap">
        <div class="cyber-core">
          <div class="core-ring ring-1"></div>
          <div class="core-ring ring-2"></div>
          <div class="cube-3d">
            <div class="cube-face front"></div>
            <div class="cube-face back"></div>
            <div class="cube-face right"></div>
            <div class="cube-face left"></div>
            <div class="cube-face top"></div>
            <div class="cube-face bottom"></div>
          </div>
        </div>
      </div>
      
      <div class="hero-text-wrap">
        <div class="hero-badge-row">
          <span class="system-status"><span class="status-pulse"></span> DEMO ONLINE</span>
        </div>
        <h1 class="bot-3d-title">TEST ARCHIVES</h1>
        <p class="bot-credits">Built by <span class="creator-tag">TEST_DEVELOPER</span></p>
      </div>
    </div>

    <div class="controls-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Search test transcripts..." oninput="filterDemo()">
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Opened By</th>
            <th>Type</th>
            <th>Closed By</th>
            <th>Closed Date</th>
            <th style="text-align:right;">Action</th>
          </tr>
        </thead>
        <tbody id="ticketTbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/theme.js"></script>
<script>
const demoTickets = [
  { id: 'TEST01', openedBy: 'TEST_USER_1', type: 'TEST_SUPPORT', closedBy: 'TEST_STAFF_A', closedAt: '2026-08-01' },
  { id: 'TEST02', openedBy: 'TEST_USER_2', type: 'TEST_BUG', closedBy: 'TEST_STAFF_B', closedAt: '2026-08-02' },
  { id: 'TEST03', openedBy: 'TEST_USER_3', type: 'TEST_MANAGEMENT', closedBy: 'TEST_STAFF_A', closedAt: '2026-08-03' },
  { id: 'TEST04', openedBy: 'TEST_USER_4', type: 'TEST_GENERAL', closedBy: 'TEST_STAFF_C', closedAt: '2026-08-04' },
  { id: 'TEST05', openedBy: 'TEST_USER_5', type: 'TEST_SUPPORT', closedBy: 'TEST_STAFF_B', closedAt: '2026-08-05' }
];

function renderDemo(list) {
  const tbody = document.getElementById('ticketTbody');
  tbody.innerHTML = list.map(t => `
    <tr>
      <td class="mono" style="font-weight:600;">#${t.id}</td>
      <td><strong>${t.openedBy}</strong></td>
      <td><span style="color:var(--accent); font-weight:600;">${t.type}</span></td>
      <td>${t.closedBy}</td>
      <td style="color:var(--muted);">${t.closedAt}</td>
      <td style="text-align:right;">
        <button class="btn-view" onclick="alert('Demo Transcript: TEST')">View Transcript</button>
      </td>
    </tr>
  `).join('');
}

function filterDemo() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = demoTickets.filter(t => 
    t.id.toLowerCase().includes(query) ||
    t.openedBy.toLowerCase().includes(query) ||
    t.type.toLowerCase().includes(query)
  );
  renderDemo(filtered);
}

if (typeof RF !== 'undefined' && typeof RF.renderNav === 'function') {
  document.getElementById('navTabs').innerHTML = RF.renderNav('/', null);
}

renderDemo(demoTickets);
</script>
</body>
</html>
