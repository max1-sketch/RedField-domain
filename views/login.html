<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: {{ACCENT_COLOR}};
    --bg-0: #0b0d12;
    --panel: #131720;
    --border: #222735;
    --ink: #e3e6ed;
    --muted: #8891a0;
    --discord-blue: #5865f2;
    --discord-blue-hover: #4752c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg-0); color: var(--ink);
    font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 6%; width: 100%; max-width: 1200px; margin: 0 auto;
  }
  .brand { font-size: 18px; font-weight: 800; }

  nav { display: flex; align-items: center; gap: 16px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: color .15s; }
  nav a:hover { color: var(--ink); }

  /* Member Login Button in Header */
  .btn-member-login {
    background: var(--discord-blue);
    color: #fff !important;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600 !important;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .btn-member-login:hover { background: var(--discord-blue-hover) !important; }

  .hero-container {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    gap: 40px; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px 6% 60px;
  }
  
  .hero-left { flex: 1; max-width: 480px; }
  h1 { font-size: 32px; font-weight: 800; margin: 0 0 10px; }
  p.sub { font-size: 14.5px; color: var(--muted); line-height: 1.6; margin: 0 0 28px; }

  .hero-right { flex: 1; display: flex; justify-content: flex-end; }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }

  .discord-login-btn {
    width: 100%; background: var(--discord-blue); color: #fff; font-weight: 600;
    padding: 12px; border-radius: 8px; text-decoration: none; display: flex;
    align-items: center; justify-content: center; gap: 10px; font-size: 14px;
    border: none; cursor: pointer; transition: background 0.15s;
  }
  .discord-login-btn:hover { background: var(--discord-blue-hover); }

  .trust-notice {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--muted); text-align: center;
  }

  @media (max-width: 800px) {
    .hero-container { flex-direction: column; text-align: center; }
    .hero-left { max-width: 100%; }
    .hero-right { justify-content: center; width: 100%; }
    .login-card { max-width: 100%; }
  }
</style>
</head>
<body>

  <header>
    <div class="brand">{{SITE_TITLE}}</div>
    <nav>
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
      <a href="/auth/discord" class="btn-member-login">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.6 3l-.3.6a14 14 0 0 1 4 1.6c-2.9-1.4-6.7-1.4-9.6 0a10 10 0 0 1 4-1.6L13.4 3a19.7 19.7 0 0 0-4.7 1.4C5.6 8.6 4.8 12.7 5.2 16.7a19.9 19.9 0 0 0 5.1 2.5l.7-1.1a13 13 0 0 1-2-1c.2-.1.3-.2.5-.3a14 14 0 0 0 11 0l.5.3c-.6.4-1.3.7-2 1l.7 1.1a19.8 19.8 0 0 0 5.1-2.5c.5-4.6-.7-8.7-2.9-12.3ZM9.7 14.3c-.8 0-1.5-.8-1.5-1.7 0-1 .7-1.7 1.5-1.7s1.5.8 1.5 1.7c0 1-.7 1.7-1.5 1.7Zm5.6 0c-.8 0-1.5-.8-1.5-1.7 0-1 .7-1.7 1.5-1.7s1.5.8 1.5 1.7c0 1-.7 1.7-1.5 1.7Z"/></svg>
        Member Login
      </a>
    </nav>
  </header>

  <div class="hero-container">
    <div class="hero-left">
      <h1>Redfield Portal</h1>
      <p class="sub">Sign in with your Discord account to access support tickets, community services, and portal features.</p>
    </div>

    <div class="hero-right">
      <div class="login-card">
        <h2 style="margin:0 0 6px; font-size:20px;">Sign In</h2>
        <p style="margin:0 0 20px; font-size:13px; color:var(--muted);">Sign in using Discord OAuth2 to continue.</p>

        <a href="/auth/discord" class="discord-login-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.6 3l-.3.6a14 14 0 0 1 4 1.6c-2.9-1.4-6.7-1.4-9.6 0a10 10 0 0 1 4-1.6L13.4 3a19.7 19.7 0 0 0-4.7 1.4C5.6 8.6 4.8 12.7 5.2 16.7a19.9 19.9 0 0 0 5.1 2.5l.7-1.1a13 13 0 0 1-2-1c.2-.1.3-.2.5-.3a14 14 0 0 0 11 0l.5.3c-.6.4-1.3.7-2 1l.7 1.1a19.8 19.8 0 0 0 5.1-2.5c.5-4.6-.7-8.7-2.9-12.3ZM9.7 14.3c-.8 0-1.5-.8-1.5-1.7 0-1 .7-1.7 1.5-1.7s1.5.8 1.5 1.7c0 1-.7 1.7-1.5 1.7Zm5.6 0c-.8 0-1.5-.8-1.5-1.7 0-1 .7-1.7 1.5-1.7s1.5.8 1.5 1.7c0 1-.7 1.7-1.5 1.7Z"/></svg>
          Sign in with Discord
        </a>

        <div class="trust-notice">
          🔒 Secure authentication powered by Discord OAuth2
        </div>
      </div>
    </div>
  </div>

</body>
</html>
