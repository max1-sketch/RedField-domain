<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — My Account</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
  --amber: #f59e0b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.account-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--accent); color: var(--ink); text-decoration: none; position: relative; }
.account-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; background: var(--accent); color: #0a0c11; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; overflow: hidden; }
.account-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.account-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.account-name { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-sub { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-new-badge { position: absolute; top: -6px; right: -6px; font-size: 8.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--red); color: #fff; padding: 2px 6px; border-radius: 99px; box-shadow: 0 0 0 2px var(--sidebar-bg); }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 620px; }
.page-title { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; line-height: 1.6; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 22px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.card-header h2 { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0; }

.profile-top { display: flex; align-items: center; gap: 14px; }
.avatar-big { width: 56px; height: 56px; border-radius: 50%; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: var(--accent); flex-shrink: 0; object-fit: cover; }
.profile-name { font-size: 18px; font-weight: 800; color: var(--ink); margin: 0 0 4px; }
.profile-tag { font-size: 12.5px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.tier-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 5px; margin-top: 8px; text-transform: uppercase; letter-spacing: .03em; }
.tier-badge.admin { background: var(--red)22; color: var(--red); }
.tier-badge.staff { background: var(--accent)22; color: var(--accent); }
.tier-badge.master { background: var(--amber)22; color: var(--amber); }

.field { margin-bottom: 14px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); font-weight: 600; display: block; margin-bottom: 6px; }
.field .hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }
input[type=text] {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px; width: 100%;
}
input[type=text]:focus { outline: none; border-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 8px; padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn:disabled { opacity: .6; cursor: not-allowed; }

.save-status { font-size: 12px; color: var(--green); opacity: 0; transition: opacity .2s; font-weight: 600; margin-left: 10px; }
.save-status.show { opacity: 1; }

.loading-line { font-size: 13px; color: var(--faint); padding: 30px 0; text-align: center; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <a href="/account" class="account-card">
        <span class="account-avatar" id="accountAvatar">👤</span>
        <span class="account-info">
          <span class="account-name" id="accountName">My Account</span>
          <span class="account-sub" id="accountSub">View profile</span>
        </span>
        <span class="account-new-badge">NEW</span>
      </a>
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <h1 class="page-title">My Account</h1>
    <p class="page-sub">Your dashboard identity and reply settings.</p>
    <div id="content">
      <div class="loading-line">Loading…</div>
    </div>
  </main>
</div>

<script src="/theme.js"></script>
<script>
function esc(str) {
  return (str === undefined || str === null ? '' : String(str))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

if (typeof RF !== 'undefined' && RF.startSessionClock) {
  RF.startSessionClock(document.getElementById('sessionClock'));
}

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value, days) {
  document.cookie = `${name}=${encodeURIComponent(value)}; Path=/; Max-Age=${days * 86400}`;
}

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      const allowedTabs = g.viewerTier === 'staff' ? g.staffPermissions?.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, allowedTabs);
    } else {
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
  }
  const logoutIconEl = document.getElementById('logoutIcon');
  if (logoutIconEl && RF.ICONS?.logout) logoutIconEl.innerHTML = RF.ICONS.logout;
}

async function load() {
  try {
    const res = await fetch('/api/me');
    if (res.status === 401) { window.location.href = '/login'; return; }
    if (!res.ok) {
      document.getElementById('content').innerHTML = `<div class="card"><p style="margin:0;color:var(--muted);font-size:12.5px;">Couldn't load your account. Refresh and try again.</p></div>`;
      return;
    }
    const me = await res.json();
    render(me);
  } catch (err) {
    console.error('[account] load failed:', err);
    document.getElementById('content').innerHTML = `<div class="card"><p style="margin:0;color:var(--muted);font-size:12.5px;">Couldn't reach the server. (${esc(err.message || 'unknown error')})</p></div>`;
  }
}

function render(me) {
  const initial = (me.displayName || me.tag || '?').charAt(0).toUpperCase();
  const avatarHtml = me.avatarURL
    ? `<img class="avatar-big" src="${esc(me.avatarURL)}" alt="">`
    : `<div class="avatar-big">${esc(initial)}</div>`;
  const tierLabel = { admin: 'Administrator', staff: 'Staff', master: 'Access Code Login', member: 'Member' }[me.tier] || me.tier;

  // The sidebar widget already has this data from the same /api/me call — no
  // need for a second fetch just to fill it in.
  const sideAvatarEl = document.getElementById('accountAvatar');
  const sideNameEl = document.getElementById('accountName');
  const sideSubEl = document.getElementById('accountSub');
  if (sideAvatarEl) sideAvatarEl.innerHTML = me.avatarURL ? `<img src="${esc(me.avatarURL)}" alt="">` : esc(initial);
  if (sideNameEl) sideNameEl.textContent = me.displayName || me.tag || 'My Account';
  if (sideSubEl) sideSubEl.textContent = tierLabel;

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="profile-top">
        ${avatarHtml}
        <div>
          <div class="profile-name">${esc(me.displayName || me.tag)}</div>
          <div class="profile-tag">${esc(me.tag)}${me.id ? ' · ' + esc(me.id) : ''}</div>
          <span class="tier-badge ${esc(me.tier)}">${esc(tierLabel)}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Reply settings</h2></div>
      <div class="field">
        <label>Display name for ticket replies</label>
        <input type="text" id="senderName" maxlength="40" placeholder="${esc(me.displayName || me.tag)}">
        <p class="hint">This is the name shown when you reply to tickets from the website ("via Website" messages). It's remembered on this browser — set it once here instead of retyping it on every ticket.</p>
      </div>
      <button class="btn btn-accent" id="saveSenderBtn">Save</button>
      <span class="save-status" id="saveStatus">Saved ✓</span>
    </div>

    <div class="card">
      <div class="card-header"><h2>Session</h2></div>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;">${me.tier === 'master'
        ? "You're signed in with the shared access code, not a personal Discord login — sessions last 10 minutes and there's no personal account to sign out of individually."
        : "Your session lasts 10 minutes of inactivity, then you'll be asked to sign in again."}</p>
      <a href="/logout" class="btn btn-danger" style="text-decoration:none;">Log out now</a>
    </div>
  `;

  const senderInput = document.getElementById('senderName');
  senderInput.value = getCookie('websiteSenderName') || '';

  document.getElementById('saveSenderBtn').addEventListener('click', () => {
    const value = senderInput.value.trim();
    setCookie('websiteSenderName', value, 90);
    const status = document.getElementById('saveStatus');
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 1800);
  });
}

initNav();
load();
</script>
</body>
</html>
