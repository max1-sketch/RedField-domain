<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Member Details</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
  --amber: #f59e0b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 800px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
.back-link:hover { color: var(--accent); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.card-header h2 { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0; display: flex; align-items: center; }

.profile-top { display: flex; align-items: center; gap: 14px; }
.avatar-big { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.profile-name { font-size: 18px; font-weight: 800; color: var(--ink); margin: 0; }
.profile-tag { font-size: 12.5px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-left: 6px; vertical-align: middle; }
.badge.timeout { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.badge.owner { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
.badge.access { background: rgba(34, 197, 94, 0.15); color: var(--green); }
.badge.siteban { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.badge.loginblock { background: rgba(245, 158, 11, 0.15); color: var(--amber); }

.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px 16px; font-size: 12px; color: var(--faint); margin-top: 16px; }
.meta-grid span b { display: block; color: var(--muted); font-weight: 600; margin-bottom: 2px; font-size: 10.5px; text-transform: uppercase; }
.role-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.role-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
.role-chip .role-x { background: none; border: none; color: inherit; opacity: .6; cursor: pointer; font-size: 12px; line-height: 1; padding: 0 2px; }
.role-chip .role-x:hover { opacity: 1; color: var(--red); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 8px; padding: 9px 15px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; transition: opacity .15s; }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-amber { background: rgba(245,158,11,0.12); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.btn-amber:hover { background: rgba(245,158,11,0.2); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn-danger.solid { background: var(--red); color: #fff; border: none; }
.btn-green.solid { background: var(--green); color: #06210f; border: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.action-row { display: flex; gap: 10px; flex-wrap: wrap; }

.note-item { padding: 12px; background: var(--panel-2); border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--faint); }
.note-item.warning { border-left-color: var(--amber); }
.note-item .note-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.note-item .note-type { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--faint); }
.note-item.warning .note-type { color: var(--amber); }
.note-item .note-meta { font-size: 10.5px; color: var(--faint); }
.note-item .note-content { font-size: 13px; color: var(--ink); margin-top: 6px; white-space: pre-wrap; }
.note-item .note-del { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 11px; margin-top: 8px; padding: 0; }
.note-item .note-del:hover { color: var(--red); }
.empty-note { font-size: 12.5px; color: var(--faint); text-align: center; padding: 16px; }

input[type=text], select, textarea { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.field { margin-bottom: 12px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); font-weight: 600; display: block; margin-bottom: 6px; }
.inline-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.inline-row .field { flex: 1; margin-bottom: 0; min-width: 160px; }

.restrict-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.checkbox-card { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--border); padding: 10px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(5,6,9,.75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 380px; max-width: 100%; }
.modal h3 { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
.modal .warn-text { font-size: 12px; color: var(--red); margin: 0 0 14px; line-height: 1.5; }
.modal-error { font-size: 12px; color: var(--red); margin-bottom: 10px; min-height: 1em; }
.modal-actions { display: flex; gap: 10px; margin-top: 4px; }
.modal-actions .btn { flex: 1; }
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <a href="/moderation" class="back-link">← Back to members</a>
    <div id="content">
      <div class="loading-line" style="text-align:center; padding:30px; color:var(--faint);">Loading…</div>
    </div>
    {{FOOTER_NOTE_HTML}}
  </main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="kickOverlay">
  <div class="modal">
    <h3>Kick <span id="kickTarget" class="mono"></span>?</h3>
    <p class="warn-text">They can rejoin with a new invite. This is logged.</p>
    <div class="field"><label>Reason (required)</label><textarea id="kickReason" maxlength="400"></textarea></div>
    <div class="modal-error" id="kickError"></div>
    <div class="modal-actions">
      <button class="btn btn-danger solid" id="confirmKick">Kick</button>
      <button class="btn btn-ghost" id="cancelKick">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="banOverlay">
  <div class="modal">
    <h3>Ban <span id="banTarget" class="mono"></span>?</h3>
    <p class="warn-text">This is permanent until manually removed. This is logged.</p>
    <div class="field"><label>Reason (required)</label><textarea id="banReason" maxlength="400"></textarea></div>
    <div class="field"><label>Delete recent messages</label>
      <select id="banDeleteDays">
        <option value="0">Don't delete</option>
        <option value="1">Last 24 hours</option>
        <option value="3">Last 3 days</option>
        <option value="7">Last 7 days</option>
      </select>
    </div>
    <div class="modal-error" id="banError"></div>
    <div class="modal-actions">
      <button class="btn btn-danger solid" id="confirmBan">Ban</button>
      <button class="btn btn-ghost" id="cancelBan">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="timeoutOverlay">
  <div class="modal">
    <h3>Timeout <span id="timeoutTarget" class="mono"></span>?</h3>
    <p class="warn-text" id="timeoutSummary"></p>
    <div class="modal-error" id="timeoutError"></div>
    <div class="modal-actions">
      <button class="btn btn-amber" id="confirmTimeout">Apply timeout</button>
      <button class="btn btn-ghost" id="cancelTimeout">Cancel</button>
    </div>
  </div>
</div>

<script src="/theme.js"></script>
<script>
RF.startSessionClock(document.getElementById('sessionClock'));

const userId = window.location.pathname.split('/').pop();
let lastMember = null;
let viewerTier = 'none';

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      viewerTier = g.viewerTier || 'none';
      const allowedTabs = viewerTier === 'staff' ? g.staffPermissions?.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav('/moderation', allowedTabs);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav('/moderation', null);
  }
}

async function load() {
  try {
    const data = await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}`);
    lastMember = data;
    render();
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="card" style="color:var(--red); text-align:center;">${RF.esc(err.message)}</div>`;
  }
}

function render() {
  const m = lastMember;
  const canAdmin = viewerTier === 'admin' || viewerTier === 'master';
  const restr = m.restriction || {};
  const hasAccess = Boolean(m.isStaff);

  const roleChips = m.roles.length
    ? m.roles.map(r => `<span class="role-chip" style="color:${r.color || 'var(--muted)'}">${RF.esc(r.name)} <button class="role-x" onclick="removeRole('${r.id}')">×</button></span>`).join('')
    : '<span class="role-chip">No roles</span>';

  const availableRoles = (m.allGuildRoles || []).filter(r => !m.roles.some(mr => mr.id === r.id));
  const addRoleOptions = availableRoles.length
    ? `<option value="">+ Add a role…</option>` + availableRoles.map(r => `<option value="${r.id}">${RF.esc(r.name)}</option>`).join('')
    : `<option value="">No roles available</option>`;

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="profile-top">
        <img class="avatar-big" src="${RF.esc(m.avatarURL)}" alt="">
        <div>
          <h2 class="profile-name">${RF.esc(m.displayName)} ${hasAccess ? '<span class="badge access">Dashboard Access</span>' : ''}</h2>
          <div class="profile-tag">${RF.esc(m.tag)} · ${RF.esc(m.id)}</div>
        </div>
      </div>
      <div class="meta-grid">
        <span><b>Joined</b>${RF.esc(m.joinedAt || 'Unknown')}</span>
        <span><b>Created</b>${RF.esc(m.createdAt || 'Unknown')}</span>
      </div>
      <div class="role-chip-row">${roleChips}</div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Dashboard Access</h2></div>
      <p style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">
        ${hasAccess ? 'This user currently has staff access to the dashboard.' : 'This user does not have staff access to the dashboard.'}
      </p>
      ${canAdmin ? `<button class="btn ${hasAccess ? 'btn-danger' : 'btn-green solid'}" id="toggleAccessBtn">${hasAccess ? 'Revoke Access' : 'Grant Access'}</button>` : ''}
    </div>

    ${canAdmin ? `
    <div class="card">
      <div class="card-header"><h2>Staff Access Controls</h2></div>
      <div class="restrict-grid">
        <label class="checkbox-card"><input type="checkbox" id="r-loginBlocked" ${restr.loginBlocked ? 'checked' : ''}> Block Sign-in</label>
        <label class="checkbox-card"><input type="checkbox" id="r-siteBanned" ${restr.siteBanned ? 'checked' : ''}> Ban from Site</label>
        <label class="checkbox-card"><input type="checkbox" id="r-moderationBanned" ${restr.moderationBanned ? 'checked' : ''}> Restrict Moderation</label>
        <label class="checkbox-card"><input type="checkbox" id="r-ticketsSuspended" ${restr.ticketsSuspended ? 'checked' : ''}> Suspend Tickets</label>
      </div>
      <div class="field" style="margin-top:14px;">
        <label>Reason (sent via DM if notifying)</label>
        <input type="text" id="r-reason" value="${RF.esc(restr.reason || '')}" placeholder="Reason for action...">
      </div>
      <div class="action-row" style="margin-top:14px;">
        <button class="btn btn-accent" id="saveRestrictionsBtn">Save Controls & Notify</button>
        <button class="btn btn-ghost" id="clearAllRestrictionsBtn">Clear Restrictions</button>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-header"><h2>Roles & Nickname</h2></div>
      <div class="inline-row" style="margin-bottom:14px;">
        <div class="field"><label>Nickname</label><input type="text" id="nicknameInput" placeholder="${RF.esc(m.displayName)}"></div>
        <button class="btn btn-ghost" id="setNicknameBtn">Set Nickname</button>
      </div>
      <div class="inline-row">
        <div class="field"><label>Add Role</label><select id="addRoleSelect">${addRoleOptions}</select></div>
        <button class="btn btn-ghost" id="addRoleBtn" ${availableRoles.length ? '' : 'disabled'}>Add Role</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Actions</h2></div>
      <div class="action-row">
        <button class="btn btn-amber" id="applyTimeoutBtn">Timeout</button>
        <button class="btn btn-danger" id="kickBtn">Kick</button>
        <button class="btn btn-danger" id="banBtn">Ban</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Notes & Warnings</h2></div>
      <div class="inline-row" style="margin-bottom:14px;">
        <select id="noteType" style="flex:0 0 120px;">
          <option value="note">Note</option>
          <option value="warning">Warning</option>
        </select>
        <input type="text" id="noteContent" placeholder="Enter note details...">
        <button class="btn btn-accent" id="addNoteBtn">Add Note</button>
      </div>
      <div id="notesList"></div>
    </div>
  `;

  renderNotes();
  wireActions();
}

function renderNotes() {
  const list = document.getElementById('notesList');
  const notes = lastMember.notes || [];
  if (!notes.length) { list.innerHTML = '<div class="empty-note">No notes yet.</div>'; return; }
  list.innerHTML = notes.slice().reverse().map(n => `
    <div class="note-item ${n.type}">
      <div class="note-top">
        <span class="note-type">${n.type === 'warning' ? '⚠ Warning' : 'Note'}</span>
        <span class="note-meta">${RF.esc(n.byName)} · ${RF.esc(n.at)}</span>
      </div>
      <div class="note-content">${RF.esc(n.content)}</div>
      <button class="note-del" onclick="deleteNote('${n.id}')">Delete</button>
    </div>
  `).join('');
}

async function removeRole(roleId) {
  try {
    await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/roles`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ remove: roleId })
    });
    RF.toast('Role removed', true);
    load();
  } catch (err) { RF.toast(err.message, false); }
}

async function deleteNote(noteId) {
  try {
    await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/notes/${encodeURIComponent(noteId)}`, { method: 'DELETE' });
    lastMember.notes = lastMember.notes.filter(n => n.id !== noteId);
    renderNotes();
    RF.toast('Note deleted', true);
  } catch (err) { RF.toast(err.message, false); }
}

function wireActions() {
  const toggleBtn = document.getElementById('toggleAccessBtn');
  if (toggleBtn) {
    toggleBtn.onclick = async () => {
      const hasAccess = Boolean(lastMember.isStaff);
      try {
        const action = hasAccess ? 'revoke' : 'grant';
        await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/access`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action })
        });
        RF.toast(`Access ${hasAccess ? 'revoked' : 'granted'} & DM sent`, true);
        load();
      } catch (err) { RF.toast(err.message, false); }
    };
  }

  const saveRestrBtn = document.getElementById('saveRestrictionsBtn');
  if (saveRestrBtn) {
    saveRestrBtn.onclick = async () => {
      try {
        await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/restrictions`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            loginBlocked: document.getElementById('r-loginBlocked').checked,
            siteBanned: document.getElementById('r-siteBanned').checked,
            moderationBanned: document.getElementById('r-moderationBanned').checked,
            ticketsSuspended: document.getElementById('r-ticketsSuspended').checked,
            reason: document.getElementById('r-reason').value.trim(),
            notifyUser: true
          })
        });
        RF.toast('Restrictions saved & user notified', true);
        load();
      } catch (err) { RF.toast(err.message, false); }
    };
  }

  const clearAllBtn = document.getElementById('clearAllRestrictionsBtn');
  if (clearAllBtn) {
    clearAllBtn.onclick = async () => {
      try {
        await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/restrictions`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginBlocked: false, siteBanned: false, moderationBanned: false, ticketsSuspended: false, reason: '' })
        });
        RF.toast('All restrictions cleared', true);
        load();
      } catch (err) { RF.toast(err.message, false); }
    };
  }

  const setNickBtn = document.getElementById('setNicknameBtn');
  if (setNickBtn) {
    setNickBtn.onclick = async () => {
      const nickname = document.getElementById('nicknameInput').value.trim();
      try {
        await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/nickname`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nickname })
        });
        RF.toast('Nickname updated', true);
        load();
      } catch (err) { RF.toast(err.message, false); }
    };
  }

  const addRoleBtn = document.getElementById('addRoleBtn');
  if (addRoleBtn) {
    addRoleBtn.onclick = async () => {
      const roleId = document.getElementById('addRoleSelect').value;
      if (!roleId) return;
      try {
        await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/roles`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ add: roleId })
        });
        RF.toast('Role added', true);
        load();
      } catch (err) { RF.toast(err.message, false); }
    };
  }

  const addNoteBtn = document.getElementById('addNoteBtn');
  if (addNoteBtn) {
    addNoteBtn.onclick = async () => {
      const type = document.getElementById('noteType').value;
      const content = document.getElementById('noteContent').value.trim();
      if (!content) return;
      try {
        const data = await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/notes`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, content })
        });
        lastMember.notes = (lastMember.notes || []).concat([data.note]);
        document.getElementById('noteContent').value = '';
        renderNotes();
        RF.toast('Note added', true);
      } catch (err) { RF.toast(err.message, false); }
    };
  }

  document.getElementById('kickBtn').onclick = () => {
    document.getElementById('kickTarget').textContent = lastMember.tag;
    document.getElementById('kickOverlay').classList.add('show');
  };
  document.getElementById('banBtn').onclick = () => {
    document.getElementById('banTarget').textContent = lastMember.tag;
    document.getElementById('banOverlay').classList.add('show');
  };
  document.getElementById('applyTimeoutBtn').onclick = () => {
    document.getElementById('timeoutTarget').textContent = lastMember.tag;
    document.getElementById('timeoutSummary').textContent = 'User will be temporarily restricted in Discord.';
    document.getElementById('timeoutOverlay').classList.add('show');
  };
}

// Modal Handlers
document.getElementById('cancelKick').onclick = () => document.getElementById('kickOverlay').classList.remove('show');
document.getElementById('cancelBan').onclick = () => document.getElementById('banOverlay').classList.remove('show');
document.getElementById('cancelTimeout').onclick = () => document.getElementById('timeoutOverlay').classList.remove('show');

document.getElementById('confirmKick').onclick = async () => {
  const reason = document.getElementById('kickReason').value.trim();
  if (!reason) return;
  try {
    await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/kick`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason })
    });
    window.location.href = '/moderation';
  } catch (err) { document.getElementById('kickError').textContent = err.message; }
};

document.getElementById('confirmBan').onclick = async () => {
  const reason = document.getElementById('banReason').value.trim();
  if (!reason) return;
  try {
    await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/ban`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason, deleteMessageDays: document.getElementById('banDeleteDays').value })
    });
    window.location.href = '/moderation';
  } catch (err) { document.getElementById('banError').textContent = err.message; }
};

document.getElementById('confirmTimeout').onclick = async () => {
  try {
    await RF.apiCall(`/api/moderation/members/${encodeURIComponent(userId)}/timeout`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ minutes: 60, reason: 'Dashboard action' })
    });
    document.getElementById('timeoutOverlay').classList.remove('show');
    load();
  } catch (err) { document.getElementById('timeoutError').textContent = err.message; }
};

initNav();
load();
</script>
</body>
</html>
