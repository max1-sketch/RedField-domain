<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Open Tickets</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }
.badge-beta { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: auto; text-transform: uppercase; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1300px; }
.page-title { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: livepulse 1.8s infinite; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
.filters-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 18px 20px; }
input[type=text], select { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px; }
input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }
.search-wrap { position: relative; flex: 1 1 260px; min-width: 200px; }
.search-wrap input { width: 100%; padding-left: 32px; }
.search-wrap::before { content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 15px; }
.count-pill { font-size: 12px; color: var(--faint); white-space: nowrap; margin-left: auto; }
.count-pill b { color: var(--accent); font-weight: 700; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: opacity .15s, border-color .15s; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }

table { width: 100%; border-collapse: collapse; }
thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 13px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
.cell-main { color: var(--ink); font-weight: 600; }
.cell-muted { color: var(--muted); }
.type-badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; }
.tag-chip-row { display: flex; flex-wrap: wrap; gap: 5px; max-width: 200px; }
.tag-chip { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.actions-cell { display: flex; gap: 8px; justify-content: flex-end; }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.status-badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 5px; }
.status-badge.open { background: #22c55e22; color: var(--green); }
.status-badge.closing { background: #ef444422; color: var(--red); }

.empty-row td { text-align: center; padding: 50px 20px; color: var(--faint); }
.empty-row .icon { font-size: 22px; margin-bottom: 8px; display: block; }
.empty-row h3 { font-size: 14px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.empty-row p { font-size: 12.5px; margin: 0; }
.skeleton-row td { color: var(--faint); opacity: .4; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <h1 class="page-title"><span class="live-dot"></span> Open Tickets</h1>
    <p class="page-sub">Tickets currently in progress — view and respond directly from the web dashboard.</p>

    <div class="card">
      <div class="filters-row">
        <div class="search-wrap">
          <input id="search" type="text" placeholder="Search opener, claimer, reason…" autocomplete="off">
        </div>
        <select id="typeFilter"><option value="">All types</option></select>
        <select id="tagFilter"><option value="">All tags</option></select>
        <button class="btn btn-ghost" id="refreshBtn">↻ Refresh</button>
        <span class="count-pill" id="countPill">loading…</span>
      </div>
    </div>

    <div class="card" style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Opened by</th>
            <th>Claimed by</th>
            <th>Opened</th>
            <th>Status</th>
            <th>Tags</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="skeleton-row"><td colspan="7">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    {{FOOTER_NOTE_HTML}}
  </main>
</div>

<script src="/theme.js"></script>
<script>
RF.startSessionClock(document.getElementById('sessionClock'));

let allTickets = [];
let allTags = [];

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      const allowedTabs = g.viewerTier === 'staff' ? g.staffPermissions?.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, allowedTabs);
    } else {
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
  }
  const logoutIconEl = document.getElementById('logoutIcon');
  if (logoutIconEl && RF.ICONS?.logout) logoutIconEl.innerHTML = RF.ICONS.logout;
}

async function loadTags() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const data = await res.json();
      allTags = data.tags || [];
      const sel = document.getElementById('tagFilter');
      for (const t of allTags) {
        const opt = document.createElement('option');
        opt.value = t.id; opt.textContent = t.name;
        sel.appendChild(opt);
      }
    }
  } catch { /* tag filter stays empty if request fails */ }
}

function tagById(id) { return allTags.find(t => t.id === id); }

async function loadTickets() {
  try {
    const res = await fetch('/api/open-tickets');
    if (res.status === 401) {
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">🔒</span><h3>Session expired</h3><p><a href="/" style="color:var(--accent)">Log in again</a></p></td></tr>`;
      return;
    }
    if (!res.ok) {
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">⚠</span><h3>Server error</h3><p>HTTP ${res.status}</p></td></tr>`;
      return;
    }
    allTickets = await res.json();
    populateTypeFilter();
    render();
  } catch (err) {
    document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">⚠</span><h3>Couldn't load open tickets</h3><p>${RF.esc(err.message || 'Unknown error')}</p></td></tr>`;
  }
}

function populateTypeFilter() {
  const sel = document.getElementById('typeFilter');
  const existing = new Set(Array.from(sel.options).map(o => o.value));
  const types = [...new Set(allTickets.map(t => t.type).filter(Boolean))].sort();
  for (const t of types) {
    if (existing.has(t)) continue;
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  }
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const typeFilter = document.getElementById('typeFilter').value;
  const tagFilter = document.getElementById('tagFilter').value;

  let filtered = allTickets.filter(t => {
    if (typeFilter && t.type !== typeFilter) return false;
    if (tagFilter && !(Array.isArray(t.tags) && t.tags.includes(tagFilter))) return false;
    if (!q) return true;
    const haystack = [t.userTag, t.claimedBy, t.reason, t.robloxUsername].join(' ').toLowerCase();
    return haystack.includes(q);
  });
  filtered.sort((a, b) => new Date(b.openedAt || 0).getTime() - new Date(a.openedAt || 0).getTime());

  document.getElementById('countPill').innerHTML = `<b>${filtered.length}</b> of ${allTickets.length} open`;

  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">📭</span><h3>${allTickets.length ? 'No matches' : 'Nothing open right now'}</h3><p>${allTickets.length ? 'Try a different search or type filter.' : 'Tickets show up here the moment someone opens one.'}</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(t => {
    const color = RF.typeColor(t.type);
    const tagChips = (Array.isArray(t.tags) ? t.tags : []).map(tagId => {
      const tag = tagById(tagId);
      if (!tag) return '';
      return `<span class="tag-chip" style="background:${tag.color}22; color:${tag.color};">${RF.esc(tag.name)}</span>`;
    }).join('');
    return `
    <tr>
      <td><span class="type-badge" style="background:${color}22; color:${color};">${RF.esc(t.type || 'TICKET')}</span></td>
      <td class="cell-main">${RF.esc(t.userTag || 'Unknown')}${t.robloxUsername ? `<div class="cell-muted" style="font-size:11.5px;">Roblox: ${RF.esc(t.robloxUsername)}</div>` : ''}</td>
      <td class="cell-muted">${RF.esc(t.claimedBy || '—')}</td>
      <td class="cell-muted">${RF.esc(t.openedAt || 'Recently')}</td>
      <td><span class="status-badge ${t.closing ? 'closing' : 'open'}">${t.closing ? 'Closing…' : 'Open'}</span></td>
      <td><div class="tag-chip-row">${tagChips || '<span class="cell-muted" style="font-size:11.5px;">—</span>'}</div></td>
      <td style="text-align:right;">
        <div class="actions-cell">
          <a class="btn btn-accent" href="/tickets/${encodeURIComponent(t.channelId)}">View &amp; Reply</a>
          ${t.discordUrl ? `<a class="btn btn-ghost" href="${RF.esc(t.discordUrl)}" target="_blank" rel="noopener">Discord</a>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('tagFilter').addEventListener('change', render);
document.getElementById('refreshBtn').addEventListener('click', loadTickets);

initNav();
loadTags().then(loadTickets);
setInterval(loadTickets, 20000);
</script>
</body>
</html>
