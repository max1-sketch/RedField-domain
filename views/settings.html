<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Server Configs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }
.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 900px; }
.page-title { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
.page-sub b { color: var(--ink); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.card-header h2 { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0; }
.card-sub { font-size: 12.5px; color: var(--muted); margin: -8px 0 16px; line-height: 1.6; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 8px; padding: 9px 15px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn:disabled { opacity: .6; cursor: not-allowed; }

input[type=text], select {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px;
}
input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }

.owner-row { display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: var(--panel-2); border-radius: 8px; margin-bottom: 14px; font-size: 12.5px; }
.owner-badge { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: #fbbf24; border: 1px solid #fbbf2455; background: #fbbf2415; padding: 3px 8px; border-radius: 5px; }

.tier-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; font-size: 11.5px; color: var(--faint); }
.tier-legend span b { color: var(--muted); }

table { width: 100%; border-collapse: collapse; }
thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 9px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 11px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }

.role-swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
.role-list-wrap { max-height: 340px; overflow-y: auto; }

.cat-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); }
.cat-row:last-of-type { border-bottom: none; }
.cat-row .cat-label { width: 150px; flex-shrink: 0; font-size: 13px; font-weight: 600; color: var(--ink); }
.cat-row select, .cat-row input[type=text] { flex: 1; min-width: 180px; }

.perm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
.checkbox-card { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--border); padding: 10px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.checkbox-card input { cursor: pointer; }

.empty-note { font-size: 12.5px; color: var(--faint); padding: 12px 2px; }
.panel-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.save-status { font-size: 11.5px; color: var(--green); opacity: 0; transition: opacity .2s; font-weight: 600; }
.save-status.show { opacity: 1; }
.loading-line { font-size: 13px; color: var(--faint); padding: 24px 0; text-align: center; }

.dot-loader { display: inline-flex; gap: 4px; align-items: center; }
.dot-loader span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dotbounce 1s infinite ease-in-out; }
.dot-loader span:nth-child(2) { animation-delay: .15s; }
.dot-loader span:nth-child(3) { animation-delay: .3s; }
@keyframes dotbounce { 0%, 80%, 100% { transform: scale(.5); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }
#toastStack { position: fixed; top: 18px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 6px; padding: 12px 14px; font-size: 12.5px; color: var(--ink); box-shadow: 0 12px 34px rgba(0,0,0,.45); animation: toastin .2s ease; }
.toast.error { border-left-color: var(--red); }
.toast .toast-title { font-weight: 700; }
.toast.fading { animation: toastout .25s ease forwards; }
@keyframes toastin { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastout { to { opacity: 0; transform: translateX(24px); } }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div id="toastStack"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area" id="main">
    <h1 class="page-title">Server Configs</h1>
    <div class="loading-line">Reading server roles and channels…</div>
  </main>
</div>

<script>
window.RF = (function () {
  function esc(str) {
    return (str === undefined || str === null ? '' : String(str))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function startSessionClock(el) {
    function tick() {
      const expiresAt = parseInt(getCookie('sessionExpires') || '0', 10);
      if (!expiresAt) { el.textContent = 'session --:--'; return; }
      const remaining = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
      const m = Math.floor(remaining / 60), s = remaining % 60;
      el.textContent = `session ${m}:${s.toString().padStart(2, '0')}`;
      el.classList.toggle('warn', remaining <= 60);
      if (remaining <= 0) window.location.reload();
    }
    tick(); setInterval(tick, 1000);
  }
  const ICONS = {
    quickwords: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
    feedback: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 8.5 22 9.5 17 14.5 18.5 21.5 12 18 5.5 21.5 7 14.5 2 9.5 9 8.5 12 2"></polygon></svg>',
    auditlog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1Z"></path><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5Z"></path></svg>',
    archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>',
    tickets: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-5l-2 3h-4l-2-3H2"></path><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1Z"></path></svg>',
    panels: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>',
    tags: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H3v9l10.3 10.3a1 1 0 0 0 1.4 0l7.6-7.6a1 1 0 0 0 0-1.4L12 2Z"></path><circle cx="7.5" cy="7.5" r="1.4"></circle></svg>',
    blacklist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m5.5 5.5 13 13"></path></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>',
    logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>'
  };
  function renderNav(activePath, allowedTabs) {
    const tabs = [
      { key: 'archive', href: '/', label: 'Home', ic: ICONS.archive },
      { key: 'tickets', href: '/tickets', label: 'Open Tickets', ic: ICONS.tickets },
      { key: 'panels', href: '/panels', label: 'Panel Configs', ic: ICONS.panels },
      { key: 'tags', href: '/tags', label: 'Tags', ic: ICONS.tags },
      { key: 'quickwords', href: '/quickwords', label: 'Quick Words', ic: ICONS.quickwords },
      { key: 'feedback', href: '/feedback', label: 'Feedback', ic: ICONS.feedback },
      { key: 'auditlog', href: '/audit-log', label: 'Logging', ic: ICONS.auditlog, adminOnly: true },
      { key: 'moderation', href: '/moderation', label: 'Moderation', ic: ICONS.shield },
      { key: 'blacklist', href: '/blacklist', label: 'Blacklist', ic: ICONS.blacklist },
      { key: 'settings', href: '/settings', label: 'Server Configs', ic: ICONS.settings, adminOnly: true }
    ];
    // allowedTabs === null means "don't filter" — either an admin viewer, or
    // a password-login session with no per-user identity to filter by.
    // Settings itself is never hidden — a non-admin staff member simply
    // can't save anything on it, since the backend re-checks isAdmin
    // independently of whatever the sidebar happens to show.
    const visible = allowedTabs
      ? tabs.filter(t => !t.adminOnly && allowedTabs.includes(t.key))
      : tabs;
    return visible.map(t => `<a class="nav-item${t.href === activePath ? ' active' : ''}" href="${t.href}"><span class="ic">${t.ic}</span> ${t.label}</a>`).join('');
  }

  function toast(title, ok) {
    const stack = document.getElementById('toastStack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast' + (ok ? '' : ' error');
    el.innerHTML = `<div class="toast-title">${ok ? '✓' : '✕'} ${esc(title)}</div>`;
    stack.appendChild(el);
    setTimeout(() => { el.classList.add('fading'); setTimeout(() => el.remove(), 260); }, 3400);
  }

  async function withLoading(btn, fn, { okMessage, failMessage } = {}) {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="dot-loader"><span></span><span></span><span></span></span>';
    const start = Date.now();
    let result, error;
    try { result = await fn(); } catch (e) { error = e; }
    const elapsed = Date.now() - start;
    const minDelay = 900;
    if (elapsed < minDelay) await new Promise(r => setTimeout(r, minDelay - elapsed));
    btn.disabled = false;
    btn.innerHTML = original;
    if (error) { toast(failMessage ? `${failMessage}: ${error.message}` : error.message, false); throw error; }
    if (okMessage) toast(okMessage, true);
    return result;
  }

  async function apiCall(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  return { esc, getCookie, startSessionClock, renderNav, ICONS, toast, withLoading, apiCall };
})();

RF.startSessionClock(document.getElementById('sessionClock'));

let guildData = null;

async function load() {
  try {
    const res = await fetch('/api/guild');
    if (res.status === 401) { window.location.reload(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('main').innerHTML = `<h1 class="page-title">Server Configs</h1><div class="card"><h2 style="margin:0 0 6px;font-size:15px;">Couldn't load server data</h2><p class="card-sub" style="margin-top:0;">${RF.esc(err.error || 'Unknown error — check the bot is online and in the server.')}</p></div>`;
      return;
    }
    guildData = await res.json();
    const allowedTabs = guildData.viewerTier === 'staff' ? guildData.staffPermissions.allowedTabs : null;
    document.getElementById('navTabs').innerHTML = RF.renderNav('/settings', allowedTabs);
    const _logoutIconEl = document.getElementById('logoutIcon'); if (_logoutIconEl) _logoutIconEl.innerHTML = RF.ICONS.logout;
    renderPage();
  } catch (err) {
    document.getElementById('main').innerHTML = `<h1 class="page-title">Server Configs</h1><div class="card"><h2 style="margin:0 0 6px;font-size:15px;">Couldn't reach the server</h2><p class="card-sub" style="margin-top:0;">Refresh the page and try again.</p></div>`;
  }
}

function renderPage() {
  const g = guildData;
  const perms = g.staffPermissions || { allowedTabs: ['archive', 'tickets', 'panels', 'tags', 'moderation', 'blacklist'], canModerate: true };

  document.getElementById('main').innerHTML = `
    <h1 class="page-title">Server Configs</h1>
    <p class="page-sub">Managing <b>${RF.esc(g.guildName)}</b></p>

    <div class="card">
      <div class="card-header"><h2>Roles &amp; Tiers</h2></div>
      <p class="card-sub">Pick what each role can do. Admins can do everything staff can, plus they're the only ones who can use this Server Configs tab. No role assigned = normal member (can only open tickets). Also settable with <code>/configure</code> in Discord.</p>

      <div class="owner-row"><span class="owner-badge">Owner</span> ${RF.esc(g.ownerTag || g.ownerId)} <span style="color:var(--faint)">— always full access, can't be changed here</span></div>

      <div class="tier-legend">
        <span><b>Admin</b> — full control, including Settings</span>
        <span><b>Staff</b> — claim/force-close tickets</span>
        <span><b>Normal</b> — can only open tickets</span>
      </div>

      <div class="role-list-wrap">
        <table>
          <thead><tr><th>Role</th><th>Members</th><th style="width:140px;">Tier</th></tr></thead>
          <tbody id="roleTbody"></tbody>
        </table>
      </div>

      <div class="panel-actions">
        <button class="btn btn-accent" id="saveRolesBtn">Save roles</button>
        <span class="save-status" id="rolesStatus">Saved ✓</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Staff Dashboard Permissions (Admin Only)</h2></div>
      <p class="card-sub">Choose which dashboard tabs Staff members can see, and whether they are allowed to perform moderation actions (timeout, kick, ban, warn). This only filters non-admin Discord-login staff — it has no effect on the shared access-code login, which always has full access.</p>

      <div style="font-weight: 600; font-size: 12px; color: var(--ink); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">Visible Tabs for Staff</div>
      <div class="perm-grid">
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="archive" ${perms.allowedTabs.includes('archive') ? 'checked' : ''}> Archive</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="tickets" ${perms.allowedTabs.includes('tickets') ? 'checked' : ''}> Open Tickets</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="panels" ${perms.allowedTabs.includes('panels') ? 'checked' : ''}> Panels</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="tags" ${perms.allowedTabs.includes('tags') ? 'checked' : ''}> Tags</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="moderation" ${perms.allowedTabs.includes('moderation') ? 'checked' : ''}> Moderation</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="blacklist" ${perms.allowedTabs.includes('blacklist') ? 'checked' : ''}> Blacklist</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="quickwords" ${perms.allowedTabs.includes('quickwords') ? 'checked' : ''}> Quick Words</label>
        <label class="checkbox-card"><input type="checkbox" class="tab-perm" value="feedback" ${perms.allowedTabs.includes('feedback') ? 'checked' : ''}> Feedback</label>
      </div>

      <div style="font-weight: 600; font-size: 12px; color: var(--ink); margin-top: 18px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">Moderation Capabilities</div>
      <label class="checkbox-card" style="display: flex;">
        <input type="checkbox" id="canModerateCheck" ${perms.canModerate ? 'checked' : ''}>
        <span>Allow Staff members to moderate members (timeout, kick, ban, warn, add notes)</span>
      </label>

      <div class="panel-actions">
        <button class="btn btn-accent" id="savePermsBtn">Save permissions</button>
        <span class="save-status" id="permsStatus">Saved ✓</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Ticket Categories</h2></div>
      <p class="card-sub">Which Discord category each ticket type gets created under. Pick an existing one or type a new name — it's created automatically the next time that ticket type is opened.</p>
      <div id="catGrid"></div>
      <div class="panel-actions">
        <button class="btn btn-accent" id="saveCatBtn">Save categories</button>
        <span class="save-status" id="catStatus">Saved ✓</span>
      </div>
    </div>
  `;

  renderRoles();
  renderCategories();
  wireRoleSave();
  wirePermsSave();
  wireCategorySave();
}

function tierOf(roleId) {
  if (guildData.adminRoleIds.includes(roleId)) return 'admin';
  if (guildData.staffRoleIds.includes(roleId)) return 'staff';
  return 'normal';
}

function renderRoles() {
  const tbody = document.getElementById('roleTbody');
  if (!guildData.roles.length) {
    tbody.innerHTML = `<tr><td colspan="3" class="empty-note">No assignable roles found in this server.</td></tr>`;
    return;
  }
  tbody.innerHTML = guildData.roles.map(r => `
    <tr data-role-id="${r.id}">
      <td><span class="role-swatch" style="background:${r.color || '#8d9297'}"></span>${RF.esc(r.name)}</td>
      <td class="mono" style="color:var(--faint);">${r.memberCount}</td>
      <td>
        <select data-role-id="${r.id}" style="width:100%;">
          <option value="normal" ${tierOf(r.id) === 'normal' ? 'selected' : ''}>Normal</option>
          <option value="staff" ${tierOf(r.id) === 'staff' ? 'selected' : ''}>Staff</option>
          <option value="admin" ${tierOf(r.id) === 'admin' ? 'selected' : ''}>Admin</option>
        </select>
      </td>
    </tr>
  `).join('');
}

function wireRoleSave() {
  document.getElementById('saveRolesBtn').addEventListener('click', async (e) => {
    const staffRoleIds = [], adminRoleIds = [];
    document.querySelectorAll('#roleTbody select').forEach(sel => {
      const id = sel.getAttribute('data-role-id');
      if (sel.value === 'staff') staffRoleIds.push(id);
      if (sel.value === 'admin') adminRoleIds.push(id);
    });
    try {
      await RF.withLoading(e.currentTarget, () => RF.apiCall('/api/guild/roles', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ staffRoleIds, adminRoleIds })
      }), { okMessage: 'Roles saved', failMessage: "Couldn't save roles" });
      guildData.staffRoleIds = staffRoleIds;
      guildData.adminRoleIds = adminRoleIds;
      flashStatus('rolesStatus');
    } catch { /* toast already shown */ }
  });
}

function wirePermsSave() {
  document.getElementById('savePermsBtn').addEventListener('click', async (e) => {
    const allowedTabs = Array.from(document.querySelectorAll('.tab-perm:checked')).map(cb => cb.value);
    const canModerate = document.getElementById('canModerateCheck').checked;
    try {
      const data = await RF.withLoading(e.currentTarget, () => RF.apiCall('/api/guild/permissions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ allowedTabs, canModerate })
      }), { okMessage: 'Permissions saved', failMessage: "Couldn't save permissions" });
      guildData.staffPermissions = data.staffPermissions;
      flashStatus('permsStatus');
    } catch { /* toast already shown */ }
  });
}

function renderCategories() {
  const grid = document.getElementById('catGrid');
  const catNames = guildData.categories.map(c => c.name.toUpperCase());
  grid.innerHTML = Object.entries(guildData.panels).map(([typeKey, panel]) => {
    const current = (panel.categoryName || '').toUpperCase();
    const options = [...new Set([current, ...catNames])].filter(Boolean);
    return `
      <div class="cat-row" data-type="${typeKey}">
        <span class="cat-label">${RF.esc(panel.buttonLabel || typeKey)}</span>
        <select class="cat-select" data-type="${typeKey}">
          ${options.map(name => `<option value="${RF.esc(name)}" ${name === current ? 'selected' : ''}>${RF.esc(name)}</option>`).join('')}
          <option value="__new__">+ New category…</option>
        </select>
        <input type="text" class="cat-new-input" data-type="${typeKey}" placeholder="New category name" maxlength="90" style="display:none;">
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.cat-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const input = grid.querySelector(`.cat-new-input[data-type="${sel.getAttribute('data-type')}"]`);
      input.style.display = sel.value === '__new__' ? 'block' : 'none';
      if (sel.value === '__new__') input.focus();
    });
  });
}

function wireCategorySave() {
  document.getElementById('saveCatBtn').addEventListener('click', async (e) => {
    const updates = {};
    const blankRows = [];
    document.querySelectorAll('.cat-row').forEach(row => {
      const type = row.getAttribute('data-type');
      const sel = row.querySelector('.cat-select');
      const input = row.querySelector('.cat-new-input');
      const value = sel.value === '__new__' ? input.value.trim() : sel.value;
      if (sel.value === '__new__' && (!value || value.length > 90)) { blankRows.push(type); return; }
      updates[type] = value;
    });
    if (blankRows.length) {
      RF.toast(`Category for ${blankRows.join(', ')} is blank or too long (max 90 chars)`, false);
      return;
    }
    try {
      await RF.withLoading(e.currentTarget, () => RF.apiCall('/api/guild/categories', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates)
      }), { okMessage: 'Categories saved', failMessage: "Couldn't save categories" });
      flashStatus('catStatus');
      load();
    } catch { /* toast already shown */ }
  });
}

function flashStatus(id) {
  const el = document.getElementById(id);
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

load();
</script>
</body>
</html>
