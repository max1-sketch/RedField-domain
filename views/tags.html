<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Tags</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }
.badge-beta { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: auto; text-transform: uppercase; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 700px; }
.page-title { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.card-header h2 { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px; padding: 9px 15px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.btn-ghost { background: var(--panel-2); color: var(--ink); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

table { width: 100%; border-collapse: collapse; }
thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 9px 0; border-bottom: 1px solid var(--border); }
tbody td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
.tag-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
.tag-chip .swatch { width: 8px; height: 8px; border-radius: 50%; }
.empty-note { font-size: 12.5px; color: var(--faint); padding: 12px 0; text-align: center; }
.loading-line { font-size: 13px; color: var(--faint); padding: 24px 0; text-align: center; }

.modal-overlay { position: fixed; inset: 0; background: rgba(5,6,9,.75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 340px; max-width: 100%; }
.modal h3 { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); font-weight: 600; }
input[type=text] { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px; width: 100%; }
input[type=text]:focus { outline: none; border-color: var(--accent); }
input[type=color] { width: 44px; height: 34px; padding: 2px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; }
.color-row { display: flex; align-items: center; gap: 10px; }
.modal-error { font-size: 12px; color: var(--red); margin-bottom: 10px; min-height: 1em; }
.modal-actions { display: flex; gap: 10px; margin-top: 4px; }
.modal-actions .btn { flex: 1; justify-content: center; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area" id="main">
    <h1 class="page-title">Tags</h1>
    <div class="loading-line">Loading…</div>
    {{FOOTER_NOTE_HTML}}
  </main>
</div>

<div class="modal-overlay" id="createOverlay">
  <div class="modal">
    <h3>Create tag</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="newTagName" maxlength="30" placeholder="e.g. Escalated">
    </div>
    <div class="field">
      <label>Color</label>
      <div class="color-row">
        <input type="color" id="newTagColorPicker" value="#a78bfa">
        <input type="text" id="newTagColor" value="#a78bfa" maxlength="7">
      </div>
    </div>
    <div class="modal-error" id="createError"></div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="confirmCreate">Create</button>
      <button class="btn btn-ghost" id="cancelCreate">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteOverlay">
  <div class="modal">
    <h3>Delete this tag?</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.6;">It'll be removed from every ticket currently wearing it, open or archived. Can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-danger" id="confirmDelete">Delete it</button>
      <button class="btn btn-ghost" id="cancelDelete">Never mind</button>
    </div>
  </div>
</div>

<script src="/theme.js"></script>
<script>
RF.startSessionClock(document.getElementById('sessionClock'));

let tags = [];
let pendingDeleteId = null;

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      const allowedTabs = g.viewerTier === 'staff' ? g.staffPermissions?.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, allowedTabs);
    } else {
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
  }
  const logoutIconEl = document.getElementById('logoutIcon');
  if (logoutIconEl && RF.ICONS?.logout) logoutIconEl.innerHTML = RF.ICONS.logout;
}

async function load() {
  try {
    const res = await fetch('/api/guild');
    if (res.status === 401) { window.location.reload(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('main').innerHTML = `<h1 class="page-title">Tags</h1><div class="card"><p style="margin:0;color:var(--muted);font-size:12.5px;">${RF.esc(err.error || 'Could not load — check the bot is online.')}</p></div>`;
      return;
    }
    const data = await res.json();
    tags = data.tags || [];
    renderPage();
  } catch (err) {
    document.getElementById('main').innerHTML = `<h1 class="page-title">Tags</h1><div class="card"><p style="margin:0;color:var(--muted);font-size:12.5px;">Couldn't reach the server. Refresh and try again.</p></div>`;
  }
}

function renderPage() {
  document.getElementById('main').innerHTML = `
    <h1 class="page-title">Tags</h1>
    <p class="page-sub">Labels you can apply to open and archived tickets, then filter by on the Archive and Open Tickets pages.</p>

    <div class="card">
      <div class="card-header">
        <h2>All tags</h2>
        <button class="btn btn-accent" id="createBtn">+ Create Tag</button>
      </div>
      <table>
        <thead><tr><th>Tag</th><th style="text-align:right;">Actions</th></tr></thead>
        <tbody id="tagTbody"></tbody>
      </table>
    </div>
  `;
  renderTable();
  document.getElementById('createBtn').addEventListener('click', openCreateModal);
}

function renderTable() {
  const tbody = document.getElementById('tagTbody');
  if (!tags.length) {
    tbody.innerHTML = `<tr><td colspan="2" class="empty-note">No tags yet — create one to start labeling tickets.</td></tr>`;
    return;
  }
  tbody.innerHTML = tags.map(t => `
    <tr>
      <td><span class="tag-chip" style="background:${t.color}22; color:${t.color};"><span class="swatch" style="background:${t.color};"></span>${RF.esc(t.name)}</span></td>
      <td style="text-align:right;"><button class="btn btn-danger" data-id="${RF.esc(t.id)}" onclick="askDelete(this)">Delete</button></td>
    </tr>
  `).join('');
}

function openCreateModal() {
  document.getElementById('newTagName').value = '';
  document.getElementById('newTagColor').value = '#a78bfa';
  document.getElementById('newTagColorPicker').value = '#a78bfa';
  document.getElementById('createError').textContent = '';
  document.getElementById('createOverlay').classList.add('show');
  document.getElementById('newTagName').focus();
}

document.getElementById('cancelCreate').addEventListener('click', () => {
  document.getElementById('createOverlay').classList.remove('show');
});
document.getElementById('newTagColorPicker').addEventListener('input', (e) => {
  document.getElementById('newTagColor').value = e.target.value;
});
document.getElementById('newTagColor').addEventListener('input', (e) => {
  if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) document.getElementById('newTagColorPicker').value = e.target.value;
});

document.getElementById('confirmCreate').addEventListener('click', async () => {
  const name = document.getElementById('newTagName').value.trim();
  const color = document.getElementById('newTagColor').value;
  const errEl = document.getElementById('createError');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'Give it a name first.'; return; }

  const btn = document.getElementById('confirmCreate');
  btn.disabled = true;
  try {
    const res = await fetch('/api/guild/tags', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, color }) });
    const data = await res.json();
    if (res.ok) {
      tags.push(data.tag);
      renderTable();
      document.getElementById('createOverlay').classList.remove('show');
    } else {
      errEl.textContent = data.error || 'Could not create — try again.';
    }
  } catch { errEl.textContent = 'Could not reach the server.'; }
  btn.disabled = false;
});

function askDelete(btn) {
  pendingDeleteId = btn.getAttribute('data-id');
  document.getElementById('deleteOverlay').classList.add('show');
}
document.getElementById('cancelDelete').addEventListener('click', () => {
  pendingDeleteId = null;
  document.getElementById('deleteOverlay').classList.remove('show');
});
document.getElementById('confirmDelete').addEventListener('click', async () => {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  document.getElementById('deleteOverlay').classList.remove('show');
  try {
    const res = await fetch(`/api/guild/tags/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (res.ok) { tags = tags.filter(t => t.id !== id); renderTable(); }
    else alert('Could not delete — try refreshing the page.');
  } catch { alert('Could not delete — check your connection.'); }
  pendingDeleteId = null;
});

initNav();
load();
</script>
</body>
</html>
