<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Logging</title>
<link rel="stylesheet" href="/badges.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
  --amber: #f59e0b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }
.badge-beta { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: auto; text-transform: uppercase; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.account-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); text-decoration: none; position: relative; transition: border-color .15s, background .15s; }
.account-card:hover { border-color: var(--accent); background: var(--panel); }
.account-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; background: var(--accent); color: #0a0c11; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; overflow: hidden; }
.account-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.account-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.account-name { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-sub { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-new-badge { position: absolute; top: -6px; right: -6px; font-size: 8.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--red); color: #fff; padding: 2px 6px; border-radius: 99px; box-shadow: 0 0 0 2px var(--sidebar-bg); }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1200px; }
.page-title { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 4px; display: flex; align-items: center; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
.source-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.source-tab { background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer; }
.source-tab:hover { border-color: var(--accent); color: var(--ink); }
.source-tab.active { background: var(--accent); border-color: var(--accent); color: #0a0c11; }

/* Badge fallback — same rule as /badges.css, kept inline too so the badge
   still renders correctly even if that shared file isn't deployed yet. */
.badge-new {
  display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .04em;
  padding: 3px 9px; border-radius: 99px; background: linear-gradient(135deg, #5865f2, #7289ff);
  color: #fff; vertical-align: middle; margin-left: 8px; text-transform: uppercase; line-height: 1.4;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 2px 6px rgba(88,101,242,0.35);
}
.badge-beta {
  display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .04em;
  padding: 3px 9px; border-radius: 99px; background: rgba(245,158,11,0.15); color: #f59e0b;
  border: 1px solid rgba(245,158,11,0.4); vertical-align: middle; margin-left: 8px;
  text-transform: uppercase; line-height: 1.4;
}

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.card-header h2 { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0; }
.filters-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 18px 20px; }
input[type=text] { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px; }
input[type=text]:focus { outline: none; border-color: var(--accent); }
.search-wrap { position: relative; flex: 1 1 260px; min-width: 200px; }
.search-wrap input { width: 100%; padding-left: 32px; }
.search-wrap::before { content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 15px; }
.count-pill { font-size: 12px; color: var(--faint); white-space: nowrap; margin-left: auto; }
.count-pill b { color: var(--accent); font-weight: 700; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }

table { width: 100%; border-collapse: collapse; }
thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
.cell-main { color: var(--ink); font-weight: 600; }
.cell-muted { color: var(--muted); }
.action-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }

.empty-row td { text-align: center; padding: 50px 20px; color: var(--faint); }
.empty-row .icon { font-size: 22px; margin-bottom: 8px; display: block; }
.empty-row h3 { font-size: 14px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.empty-row p { font-size: 12.5px; margin: 0; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <a href="/account" class="account-card">
        <span class="account-avatar" id="accountAvatar">👤</span>
        <span class="account-info">
          <span class="account-name" id="accountName">My Account</span>
          <span class="account-sub" id="accountSub">View profile</span>
        </span>
        <span class="account-new-badge">NEW</span>
      </a>
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <h1 class="page-title">Logging<span class="badge-new">NEW</span></h1>
    <p class="page-sub">Audit log of administrative actions, config updates, and dashboard logins.</p>

    <div class="source-tabs" id="sourceTabs">
      <button class="source-tab active" data-source="website" type="button">Website / Bot Logs</button>
      <button class="source-tab" data-source="discord" type="button">Discord Server Logs</button>
    </div>

    <div class="card">
      <div class="filters-row">
        <div class="search-wrap">
          <input id="search" type="text" placeholder="Search by actor or details…" autocomplete="off">
        </div>
        <span class="count-pill" id="countPill">loading…</span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead id="tableHead"><tr><th>Action</th><th>Actor</th><th>Details</th><th>When</th></tr></thead>
          <tbody id="tbody">
            <tr class="empty-row"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    {{FOOTER_NOTE_HTML}}
  </main>
</div>

<script src="/theme.js"></script>
<script>
// Local helpers, kept independent of theme.js — esc/fmtDateTime used to only
// exist here; if theme.js doesn't happen to define them, every row with data
// in it would throw inside render() and this whole page would silently show
// "Couldn't reach the server" even though the fetch succeeded fine.
function esc(str) {
  return (str === undefined || str === null ? '' : String(str))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDateTime(iso) {
  if (!iso) return 'Unknown';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'Unknown';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

if (typeof RF !== 'undefined' && RF.startSessionClock) {
  RF.startSessionClock(document.getElementById('sessionClock'));
}

function actionColor(action) {
  if (action.includes('DELETE') || action === 'KICK' || action === 'BAN') return 'var(--red)';
  if (action.includes('CREATE') || action === 'LOGIN' || action === 'DISCORD_LOGIN') return 'var(--green)';
  if (action === 'TIMEOUT' || action.includes('UPDATE')) return 'var(--amber)';
  return 'var(--muted)';
}

// Discord's native audit log gives a numeric action code (from the
// AuditLogEvent enum), not a name — map the common ones to readable labels.
const DISCORD_ACTION_LABELS = {
  1: 'Guild Update', 10: 'Channel Create', 11: 'Channel Update', 12: 'Channel Delete',
  13: 'Overwrite Create', 14: 'Overwrite Update', 15: 'Overwrite Delete',
  20: 'Member Kick', 21: 'Member Prune', 22: 'Member Ban', 23: 'Member Unban',
  24: 'Member Update', 25: 'Member Role Update', 26: 'Member Move', 27: 'Member Disconnect', 28: 'Bot Add',
  30: 'Role Create', 31: 'Role Update', 32: 'Role Delete',
  40: 'Invite Create', 41: 'Invite Update', 42: 'Invite Delete',
  50: 'Webhook Create', 51: 'Webhook Update', 52: 'Webhook Delete',
  60: 'Emoji Create', 61: 'Emoji Update', 62: 'Emoji Delete',
  72: 'Message Delete', 73: 'Message Bulk Delete', 74: 'Message Pin', 75: 'Message Unpin',
  80: 'Integration Create', 81: 'Integration Update', 82: 'Integration Delete',
  90: 'Sticker Create', 91: 'Sticker Update', 92: 'Sticker Delete',
  110: 'Thread Create', 111: 'Thread Update', 112: 'Thread Delete',
  140: 'AutoMod Rule Create', 141: 'AutoMod Rule Update', 142: 'AutoMod Rule Delete',
  143: 'AutoMod Blocked Message', 145: 'AutoMod Timeout'
};
function discordActionLabel(code) { return DISCORD_ACTION_LABELS[code] || `Action #${code}`; }
function discordActionColor(code) {
  if ([12, 15, 20, 22, 32, 42, 52, 62, 72, 73, 82, 92, 112, 142].includes(code)) return 'var(--red)';
  if ([10, 13, 30, 40, 50, 60, 80, 90, 110, 140].includes(code)) return 'var(--green)';
  return 'var(--amber)';
}

let currentSource = 'website';
let allEntries = [];

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      const allowedTabs = g.viewerTier === 'staff' ? g.staffPermissions?.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, allowedTabs);
    } else {
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
  }
  const logoutIconEl = document.getElementById('logoutIcon');
  if (logoutIconEl && RF.ICONS?.logout) logoutIconEl.innerHTML = RF.ICONS.logout;
}

async function load() {
  const endpoint = currentSource === 'discord' ? '/api/discord-audit-log' : '/api/audit-log';
  document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="4">Loading…</td></tr>`;
  try {
    const res = await fetch(endpoint);
    if (res.status === 401) { window.location.reload(); return; }
    if (res.status === 403) {
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="4"><span class="icon">🔒</span><h3>Admins only</h3><p>This page is restricted to Administrators.</p></td></tr>`;
      document.getElementById('countPill').textContent = 'restricted';
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="4">${esc(err.error || "Couldn't load the log.")}</td></tr>`;
      return;
    }
    allEntries = await res.json();
    render();
  } catch (err) {
    console.error('[audit-log] load failed:', err);
    document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="4">Couldn't reach the server. (${esc(err.message || 'unknown error')})</td></tr>`;
  }
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const isDiscord = currentSource === 'discord';

  const filtered = allEntries.filter(e => {
    if (!q) return true;
    const haystack = isDiscord
      ? `${e.actor} ${e.reason || ''} ${e.target || ''} ${discordActionLabel(e.action)}`
      : `${e.actor} ${e.details} ${e.action}`;
    return haystack.toLowerCase().includes(q);
  });

  document.getElementById('countPill').innerHTML = `<b>${filtered.length}</b> of ${allEntries.length} entries`;
  document.getElementById('tableHead').innerHTML = isDiscord
    ? '<tr><th>Action</th><th>Actor</th><th>Target</th><th>Reason</th><th>When</th></tr>'
    : '<tr><th>Action</th><th>Actor</th><th>Details</th><th>When</th></tr>';

  const tbody = document.getElementById('tbody');
  const colCount = isDiscord ? 5 : 4;
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}"><span class="icon">📜</span><h3>${allEntries.length ? 'No matches' : 'Nothing logged yet'}</h3><p>${allEntries.length ? 'Try a different search.' : (isDiscord ? "Nothing in Discord's own server audit log yet, or the bot doesn't have View Audit Log permission." : 'Activity shows up here as staff use the dashboard.')}</p></td></tr>`;
    return;
  }

  if (isDiscord) {
    tbody.innerHTML = filtered.map(e => {
      const color = discordActionColor(e.action);
      const label = discordActionLabel(e.action);
      return `
      <tr>
        <td><span class="action-badge" style="background:${color}22; color:${color};">${esc(label)}</span></td>
        <td class="cell-main">${esc(e.actor)}</td>
        <td class="cell-muted">${esc(e.target || '—')}</td>
        <td class="cell-muted">${esc(e.reason || '—')}</td>
        <td class="cell-muted">${fmtDateTime(e.timestamp)}</td>
      </tr>`;
    }).join('');
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const color = actionColor(e.action);
    return `
    <tr>
      <td><span class="action-badge" style="background:${color}22; color:${color};">${esc(e.action.replace(/_/g, ' '))}</span></td>
      <td class="cell-main">${esc(e.actor)}</td>
      <td class="cell-muted">${esc(e.details)}</td>
      <td class="cell-muted">${fmtDateTime(e.timestamp)}</td>
    </tr>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', render);

document.querySelectorAll('.source-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.source === currentSource) return;
    document.querySelectorAll('.source-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSource = btn.dataset.source;
    document.getElementById('search').value = '';
    load();
  });
});

async function loadAccountWidget() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) return;
    const me = await res.json();
    const avatarEl = document.getElementById('accountAvatar');
    const nameEl = document.getElementById('accountName');
    const subEl = document.getElementById('accountSub');
    const tierLabels = { admin: 'Administrator', staff: 'Staff', master: 'Access code login', member: 'Member' };
    if (avatarEl) {
      avatarEl.innerHTML = me.avatarURL
        ? `<img src="${esc(me.avatarURL)}" alt="">`
        : esc((me.displayName || me.tag || '?').charAt(0).toUpperCase());
    }
    if (nameEl) nameEl.textContent = me.displayName || me.tag || 'My Account';
    if (subEl) subEl.textContent = tierLabels[me.tier] || 'View profile';
  } catch { /* leave the default placeholder in place */ }
}

initNav();
load();
loadAccountWidget();
</script>
</body>
</html>
