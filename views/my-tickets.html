<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — My Tickets</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 60px; }
.top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.logout-link { font-size: 12.5px; color: var(--faint); }
.logout-link:hover { color: var(--muted); }

.page-title { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 26px; line-height: 1.6; }

.ticket-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.ticket-info { min-width: 0; }
.ticket-type { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; background: var(--panel-2); color: var(--accent); margin-bottom: 6px; }
.ticket-reason { font-size: 13.5px; color: var(--ink); font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 380px; }
.ticket-date { font-size: 11.5px; color: var(--faint); }
.btn-view { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 8px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.btn-view:hover { border-color: var(--accent); color: var(--accent); }

.empty-state { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 40px 20px; text-align: center; color: var(--faint); font-size: 13px; }
.loading-line { font-size: 13px; color: var(--faint); padding: 30px 0; text-align: center; }
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="wrap">
  <div class="top-row">
    <div class="brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <a href="/logout" class="logout-link">Log out</a>
  </div>

  <h1 class="page-title">My Tickets</h1>
  <p class="page-sub">Every support ticket you've opened, closed. This is your own history only — not the full staff archive.</p>

  <div id="content">
    <div class="loading-line">Loading…</div>
  </div>
</div>

<script>
function esc(str) {
  return (str === undefined || str === null ? '' : String(str))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(iso) {
  if (!iso) return 'Unknown';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'Unknown';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

async function load() {
  try {
    const res = await fetch('/api/user/tickets');
    if (res.status === 401) { window.location.href = '/login'; return; }
    if (!res.ok) {
      document.getElementById('content').innerHTML = `<div class="empty-state">Couldn't load your tickets. Refresh and try again.</div>`;
      return;
    }
    const tickets = await res.json();
    render(tickets);
  } catch (err) {
    console.error('[my-tickets] load failed:', err);
    document.getElementById('content').innerHTML = `<div class="empty-state">Couldn't reach the server. (${esc(err.message || 'unknown error')})</div>`;
  }
}

function render(tickets) {
  if (!tickets.length) {
    document.getElementById('content').innerHTML = `<div class="empty-state">You haven't had any tickets closed yet — once one of your support tickets wraps up, it'll show up here.</div>`;
    return;
  }
  document.getElementById('content').innerHTML = tickets.map(t => `
    <div class="ticket-card">
      <div class="ticket-info">
        <span class="ticket-type">${esc(t.type || 'Ticket')}</span>
        <div class="ticket-reason">${esc(t.reason || 'No reason recorded')}</div>
        <div class="ticket-date">Closed ${fmtDate(t.closedAt)}</div>
      </div>
      <a class="btn-view" href="/transcript/${esc(t.id)}${t.accessToken ? '?token=' + esc(t.accessToken) : ''}">View Transcript →</a>
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
