<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Member Portal</title>
<link rel="stylesheet" href="/badges.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: {{ACCENT_COLOR}};
    --bg-0: #0a0c11;
    --sidebar-bg: #0d0f16;
    --panel: #141722;
    --panel-2: #1a1e2b;
    --border: #262b3a;
    --ink: #e7e9ee;
    --muted: #9199a8;
    --faint: #5b6272;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; }
  .sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
  nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .nav-item:hover { background: var(--panel-2); color: var(--ink); }
  .nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }

  .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 900px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; color: var(--ink); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--faint); padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tbody tr:last-child td { border-bottom: none; }

  .btn-view { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .btn-view:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav">
      <a href="/my-dashboard" class="nav-item active">📁 My Transcripts</a>
      <a href="/account" class="nav-item">⚙️ Appearance &amp; Settings</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/logout" class="nav-item">🚪 Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <div class="card">
      <h2>My Ticket History</h2>
      <p style="font-size:12.5px; color:var(--muted); margin-bottom:16px;">View transcripts for support tickets you opened on this server.</p>
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Type</th>
            <th>Closed Date</th>
            <th style="text-align:right;">Action</th>
          </tr>
        </thead>
        <tbody id="myTicketsBody">
          <tr><td colspan="4" style="text-align:center; color:var(--faint); padding:20px;">Loading your tickets...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="/theme.js"></script>
<script>
async function loadMyTickets() {
  const tbody = document.getElementById('myTicketsBody');
  try {
    const res = await fetch('/api/user/tickets');
    if (!res.ok) throw new Error('Failed to load tickets');
    const tickets = await res.json();
    
    if (!tickets.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--faint); padding:20px;">No saved transcripts found for your account.</td></tr>`;
      return;
    }

    tbody.innerHTML = tickets.map(t => `
      <tr>
        <td class="mono">#${RF.esc(t.id.slice(-6))}</td>
        <td><span style="color:var(--accent); font-weight:600;">${RF.esc(t.type)}</span></td>
        <td style="color:var(--muted);">${t.closedAt ? new Date(t.closedAt).toLocaleDateString() : '—'}</td>
        <td style="text-align:right;">
          <a href="/transcript/${t.id}${t.accessToken ? '?token=' + t.accessToken : ''}" class="btn-view">View Transcript</a>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--red); padding:20px;">${RF.esc(err.message)}</td></tr>`;
  }
}
loadMyTickets();
</script>
</body>
</html>
