<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Ticket Transcript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: {{ACCENT_COLOR}};
    --bg-0: #0a0c11;
    --panel: #141722;
    --panel-2: #1a1e2b;
    --border: #262b3a;
    --ink: #e7e9ee;
    --muted: #9199a8;
    --faint: #5b6272;
    --red: #ef4444;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg-0);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .transcript-container {
    width: 100%;
    max-width: 900px;
    padding: 30px 20px 60px;
  }

  .header-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .ticket-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .ticket-title {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    color: var(--ink);
  }

  .ticket-type-badge {
    background: rgba(214, 154, 78, 0.15);
    color: var(--accent);
    border: 1px solid rgba(214, 154, 78, 0.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    font-size: 12.5px;
  }

  .meta-item {
    color: var(--muted);
  }
  .meta-item strong {
    display: block;
    color: var(--faint);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .chat-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .msg-row {
    display: flex;
    gap: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .msg-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .msg-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    font-size: 14px;
  }

  .msg-content-wrap {
    flex: 1;
    min-width: 0;
  }

  .msg-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .msg-author {
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
  }

  .bot-tag {
    background: #5865f2;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .msg-time {
    font-size: 11px;
    color: var(--faint);
  }

  .msg-text {
    color: var(--muted);
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg-attachment {
    margin-top: 8px;
  }
  .msg-attachment img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .access-denied-box {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .denied-card {
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 4px solid var(--red);
    padding: 40px 30px;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .denied-card h2 {
    margin: 0 0 10px;
    color: var(--red);
    font-size: 20px;
    font-weight: 800;
  }
  .denied-card p {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 20px;
  }
  .btn-login {
    display: inline-block;
    background: #5865f2;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    transition: opacity .15s;
  }
  .btn-login:hover { opacity: .9; }

  .footer-sub {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
</style>
</head>
<body>

  <div class="transcript-container">
    <div id="transcriptContent">
      <div style="text-align:center; padding: 60px; color: var(--faint);">Loading transcript history...</div>
    </div>

    <!-- Footer Notice -->
    <div class="footer-sub">
      <p style="margin: 0 0 6px;">If there are any bugs with the bot or website, be sure to reach out to <strong style="color: var(--accent);">golddoggo9866</strong>.</p>
      <p style="margin: 0; opacity: 0.75;">© 2026 Izzyan Studios LLC. All Rights Reserved.</p>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    async function loadTranscript() {
      const pathParts = window.location.pathname.split('/');
      const ticketId = pathParts[pathParts.length - 1];
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const endpoint = `/api/tickets/${encodeURIComponent(ticketId)}${token ? '?token=' + encodeURIComponent(token) : ''}`;

      try {
        const res = await fetch(endpoint);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          document.getElementById('transcriptContent').innerHTML = `
            <div class="access-denied-box">
              <div class="denied-card">
                <h2>🔒 Access Restricted</h2>
                <p>${RF.esc(errData.error || 'You are not authorized to view this ticket transcript.')}</p>
                <a href="/login" class="btn-login">Sign in with Discord</a>
              </div>
            </div>
          `;
          return;
        }

        const data = await res.json();
        renderTranscript(data);
      } catch (err) {
        document.getElementById('transcriptContent').innerHTML = `
          <div style="text-align:center; color: var(--red); padding: 40px;">
            Error loading transcript: ${RF.esc(err.message)}
          </div>
        `;
      }
    }

    function renderTranscript(ticket) {
      const messagesHtml = (ticket.messages || []).map(m => {
        const authorInitial = (m.author || 'U').charAt(0).toUpperCase();
        
        let attachmentsHtml = '';
        if (m.attachments && m.attachments.length) {
          attachmentsHtml = m.attachments.map(a => {
            if (a.contentType && a.contentType.startsWith('image/')) {
              return `<div class="msg-attachment"><img src="${RF.esc(a.url)}" alt="attachment"></div>`;
            }
            return `<div class="msg-attachment"><a href="${RF.esc(a.url)}" target="_blank" style="color:var(--accent);">📁 View Attachment</a></div>`;
          }).join('');
        }

        return `
          <div class="msg-row">
            <div class="msg-avatar">${authorInitial}</div>
            <div class="msg-content-wrap">
              <div class="msg-header">
                <span class="msg-author">${RF.esc(m.author)}</span>
                ${m.isBot ? '<span class="bot-tag">BOT</span>' : ''}
                <span class="msg-time mono">${m.timestamp ? new Date(m.timestamp).toLocaleString() : ''}</span>
              </div>
              <div class="msg-text">${RF.esc(m.content)}</div>
              ${attachmentsHtml}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('transcriptContent').innerHTML = `
        <div class="header-card">
          <div class="ticket-title-row">
            <h1 class="ticket-title">Ticket Transcript <span class="mono" style="font-size:16px; color:var(--muted);">#${RF.esc(ticket.id.slice(-6))}</span></h1>
            <span class="ticket-type-badge">${RF.esc(ticket.type || 'SUPPORT')}</span>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <strong>Opened By</strong>
              ${RF.esc(ticket.openedBy || 'Unknown User')}
            </div>
            <div class="meta-item">
              <strong>Claimed By</strong>
              ${RF.esc(ticket.claimedBy || 'Unclaimed')}
            </div>
            <div class="meta-item">
              <strong>Closed By</strong>
              ${RF.esc(ticket.closedBy || 'System')}
            </div>
            <div class="meta-item">
              <strong>Closed At</strong>
              ${ticket.closedAt ? new Date(ticket.closedAt).toLocaleDateString() : '—'}
            </div>
          </div>
        </div>

        <div class="chat-box">
          ${messagesHtml || '<div style="text-align:center; color:var(--faint); padding: 20px;">No message history stored for this ticket.</div>'}
        </div>
      `;
    }

    loadTranscript();
  </script>
</body>
</html>
