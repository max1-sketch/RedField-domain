<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Live Ticket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0a0c11; padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px; margin-bottom: 18px; line-height: 1.25; }
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }
nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }
.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 40px; max-width: 860px; display: flex; flex-direction: column; height: 100vh; }

.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; flex-shrink: 0; }
.back-link:hover { color: var(--accent); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; flex-shrink: 0; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.type-badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; margin-bottom: 8px; }
.status-badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 5px; margin-left: 8px; vertical-align: middle; }
.status-badge.open { background: #22c55e22; color: var(--green); }
.status-badge.closing { background: #ef444422; color: var(--red); }
.case-title { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; font-size: 11.5px; color: var(--faint); margin-top: 12px; }
.meta-grid span b { display: block; color: var(--muted); font-weight: 600; margin-bottom: 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
.reason { font-size: 12.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 12px; white-space: pre-wrap; }

.tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.tag-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.tag-x { background: none; border: none; color: inherit; opacity: .6; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
.tag-x:hover { opacity: 1; }
#tagAdder { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 4px 8px; border-radius: 99px; font-family: inherit; }

.header-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.log-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.log-scroll { flex: 1; overflow-y: auto; padding-right: 4px; }
.log { display: flex; flex-direction: column; gap: 2px; }
.msg { display: flex; gap: 10px; padding: 8px; border-radius: 8px; }
.msg:hover { background: rgba(255,255,255,0.02); }
.msg.from-bot .avatar { background: var(--faint); }
.avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; color: #0a0c11; font-weight: 700; font-size: 11px; margin-top: 2px; }
.msg .body { flex: 1; min-width: 0; }
.line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.author { color: var(--ink); font-weight: 700; font-size: 12.5px; }
.time { color: var(--faint); font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
.content { color: var(--ink); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.attachments { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.attachments img { max-width: 240px; max-height: 200px; border-radius: 6px; border: 1px solid var(--border); display: block; }
.attachments a.filelink { display: inline-block; font-size: 11px; border: 1px solid var(--border); padding: 6px 10px; border-radius: 5px; }

.compose { flex-shrink: 0; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }
.compose-row { display: flex; gap: 8px; align-items: flex-end; }
.compose textarea {
  flex: 1; resize: none; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; min-height: 42px; max-height: 120px;
}
.compose textarea:focus { outline: none; border-color: var(--accent); }
.compose-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.name-input { background: transparent; border: none; color: var(--faint); font-size: 11px; font-family: inherit; width: 160px; }
.name-input:focus { outline: none; color: var(--ink); }
.send-note { font-size: 10.5px; color: var(--faint); }

.empty-state, .error-state { text-align: center; padding: 40px 20px; color: var(--faint); }
.error-state h2 { font-size: 14px; color: var(--muted); margin: 0 0 4px; font-weight: 700; }
.error-state p { font-size: 12px; margin: 0; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 16px 14px 20px; height: auto; min-height: 100vh; }
  .log-card { min-height: 400px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <a href="/tickets" class="back-link">← Back to open tickets</a>
    <div id="content">
      <div class="empty-state">Loading…</div>
    </div>
  </main>
</div>

<script>
window.RF = (function () {
  const TYPE_COLORS = { REDFIELD: '#22c55e', MANAGEMENT: '#3b82f6', BUG: '#f59e0b' };
  const FALLBACK_COLOR = '#a78bfa';
  function typeColor(type) { return TYPE_COLORS[type] || FALLBACK_COLOR; }
  function esc(str) {
    return (str === undefined || str === null ? '' : String(str))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(tag) { if (!tag) return '?'; return tag.split('#')[0].slice(0, 2).toUpperCase(); }
  function fmtDateTime(iso) {
    if (!iso) return 'Unknown';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return 'Unknown';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function fmtTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function setCookie(name, value, days) {
    document.cookie = `${name}=${encodeURIComponent(value)}; Path=/; Max-Age=${days * 86400}`;
  }
  function startSessionClock(el) {
    function tick() {
      const expiresAt = parseInt(getCookie('sessionExpires') || '0', 10);
      if (!expiresAt) { el.textContent = 'session --:--'; return; }
      const remaining = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
      const m = Math.floor(remaining / 60), s = remaining % 60;
      el.textContent = `session ${m}:${s.toString().padStart(2, '0')}`;
      el.classList.toggle('warn', remaining <= 60);
      if (remaining <= 0) window.location.reload();
    }
    tick(); setInterval(tick, 1000);
  }
  const ICONS = {
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5Z"></path></svg>',
    archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>',
    tickets: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-5l-2 3h-4l-2-3H2"></path><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1Z"></path></svg>',
    panels: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>',
    tags: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H3v9l10.3 10.3a1 1 0 0 0 1.4 0l7.6-7.6a1 1 0 0 0 0-1.4L12 2Z"></path><circle cx="7.5" cy="7.5" r="1.4"></circle></svg>',
    quickwords: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
    feedback: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 8.5 22 9.5 17 14.5 18.5 21.5 12 18 5.5 21.5 7 14.5 2 9.5 9 8.5 12 2"></polygon></svg>',
    auditlog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1Z"></path><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg>',
    blacklist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m5.5 5.5 13 13"></path></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>',
    logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>'
  };
  function renderNav(activePath, allowedTabs) {
    const tabs = [
      { key: 'archive', href: '/', label: 'Archive', ic: ICONS.archive },
      { key: 'tickets', href: '/tickets', label: 'Open Tickets', ic: ICONS.tickets },
      { key: 'panels', href: '/panels', label: 'Panels', ic: ICONS.panels },
      { key: 'tags', href: '/tags', label: 'Tags', ic: ICONS.tags },
      { key: 'quickwords', href: '/quickwords', label: 'Quick Words', ic: ICONS.quickwords },
      { key: 'feedback', href: '/feedback', label: 'Feedback', ic: ICONS.feedback },
      { key: 'auditlog', href: '/audit-log', label: 'Audit Log', ic: ICONS.auditlog, alwaysAdmin: true },
      { key: 'moderation', href: '/moderation', label: 'Moderation', ic: ICONS.shield },
      { key: 'blacklist', href: '/blacklist', label: 'Blacklist', ic: ICONS.blacklist },
      { key: 'settings', href: '/settings', label: 'Settings', ic: ICONS.settings, alwaysAdmin: true }
    ];
    const visible = allowedTabs ? tabs.filter(t => t.alwaysAdmin || allowedTabs.includes(t.key)) : tabs;
    return visible.map(t => `<a class="nav-item${t.href === activePath ? ' active' : ''}" href="${t.href}"><span class="ic">${t.ic}</span> ${t.label}</a>`).join('');
  }
  return { typeColor, esc, initials, fmtDateTime, fmtTime, getCookie, setCookie, startSessionClock, renderNav, ICONS };
})();

RF.startSessionClock(document.getElementById('sessionClock'));

const channelId = window.location.pathname.split('/').pop();
let allTags = [];
let lastTicket = {};
let pollTimer = null;

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      // If user is non-admin staff, pass allowedTabs. If Master/Admin, pass null (shows all tabs).
      const allowedTabs = g.viewerTier === 'staff' ? g.staffPermissions.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, allowedTabs);
    } else {
      document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav(window.location.pathname, null);
  }
  const logoutIconEl = document.getElementById('logoutIcon');
  if (logoutIconEl) logoutIconEl.innerHTML = RF.ICONS.logout;
}

function isImage(url, contentType) {
  if (contentType && contentType.startsWith('image/')) return true;
  return /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(url || '');
}

async function loadTagDefs() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) { const data = await res.json(); allTags = data.tags || []; }
  } catch { /* ignore tag load failures */ }
}

async function load(isPoll) {
  try {
    const res = await fetch(`/api/open-tickets/${encodeURIComponent(channelId)}/messages`);
    if (res.status === 401) { window.location.reload(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('content').innerHTML = `<div class="card error-state"><h2>Can't load this ticket</h2><p>${RF.esc(err.error || 'It may have just been closed.')}</p></div>`;
      if (pollTimer) clearInterval(pollTimer);
      return;
    }
    const data = await res.json();
    render(data.ticket, data.messages, isPoll);
  } catch (err) {
    if (!isPoll) document.getElementById('content').innerHTML = `<div class="card error-state"><h2>Couldn't reach the server</h2><p>Refresh and try again.</p></div>`;
  }
}

function renderTagSection(currentTagIds) {
  const current = Array.isArray(currentTagIds) ? currentTagIds : [];
  const chips = current.map(tagId => {
    const tag = allTags.find(t => t.id === tagId);
    if (!tag) return '';
    return `<span class="tag-chip" style="background:${tag.color}22; color:${tag.color};">${RF.esc(tag.name)}<button class="tag-x" onclick="removeTag('${tag.id}')">×</button></span>`;
  }).join('');
  const available = allTags.filter(t => !current.includes(t.id));
  const picker = available.length
    ? `<select id="tagAdder" onchange="addTag(this.value); this.value='';">
        <option value="">+ Add tag…</option>
        ${available.map(t => `<option value="${t.id}">${RF.esc(t.name)}</option>`).join('')}
      </select>`
    : '';
  return `<div class="tag-row">${chips}${picker}</div>`;
}

async function saveTags(newTagIds) {
  try {
    const res = await fetch(`/api/open-tickets/${encodeURIComponent(channelId)}/tags`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tagIds: newTagIds })
    });
    if (!res.ok) { alert('Could not update tags — try again.'); return; }
    lastTicket.tags = newTagIds;
    document.getElementById('tagSection').innerHTML = renderTagSection(newTagIds);
  } catch { alert('Could not update tags — check your connection.'); }
}
function addTag(tagId) {
  if (!tagId) return;
  const current = Array.isArray(lastTicket.tags) ? lastTicket.tags : [];
  if (current.includes(tagId)) return;
  saveTags([...current, tagId]);
}
function removeTag(tagId) {
  const current = Array.isArray(lastTicket.tags) ? lastTicket.tags : [];
  saveTags(current.filter(id => id !== tagId));
}

function render(t, messages, isPoll) {
  lastTicket = t;
  const color = RF.typeColor(t.type);
  const wasAtBottom = isPoll ? isScrolledToBottom() : true;

  const logHtml = messages.length
    ? messages.map(m => {
        const attachmentsHtml = (m.attachments || []).map(a =>
          isImage(a.url, a.contentType)
            ? `<a href="${RF.esc(a.url)}" target="_blank" rel="noopener"><img src="${RF.esc(a.url)}" loading="lazy" alt="attachment"></a>`
            : `<a class="filelink" href="${RF.esc(a.url)}" target="_blank" rel="noopener">📎 Attachment</a>`
        ).join('');
        const embedImagesHtml = (m.embedImages || []).map(url =>
          `<a href="${RF.esc(url)}" target="_blank" rel="noopener"><img src="${RF.esc(url)}" loading="lazy" alt="embed image"></a>`
        ).join('');
        return `
        <div class="msg${m.isBot ? ' from-bot' : ''}">
          <div class="avatar" style="background:${m.isBot ? 'var(--faint)' : color};">${RF.esc(RF.initials(m.author))}</div>
          <div class="body">
            <div class="line1"><span class="author">${RF.esc(m.author || 'Unknown')}</span><span class="time">${RF.fmtTime(m.timestamp)}</span></div>
            ${m.content ? `<div class="content">${RF.esc(m.content)}</div>` : ''}
            ${(attachmentsHtml || embedImagesHtml) ? `<div class="attachments">${attachmentsHtml}${embedImagesHtml}</div>` : ''}
          </div>
        </div>`;
      }).join('')
    : `<div class="empty-state">No messages yet.</div>`;

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="header-top">
        <div>
          <span class="type-badge" style="background:${color}22; color:${color};">${RF.esc(t.type || 'TICKET')}</span>
          <span class="status-badge ${t.closing ? 'closing' : 'open'}">${t.closing ? 'Closing…' : 'Open'}</span>
          <h2 class="case-title">${RF.esc(t.userTag || 'Unknown')}${t.robloxUsername ? ` <span style="color:var(--faint);font-weight:400;font-size:13px;">(Roblox: ${RF.esc(t.robloxUsername)})</span>` : ''}</h2>
        </div>
        <div class="header-actions">
          <a class="btn btn-ghost" href="https://discord.com/channels/${lastTicket.guildId || ''}/${channelId}" target="_blank" rel="noopener">Open in Discord</a>
          <button class="btn btn-danger" id="closeBtn" ${t.closing ? 'disabled' : ''}>${t.closing ? 'Closing…' : 'Close ticket'}</button>
        </div>
      </div>
      <div class="meta-grid">
        <span><b>Claimed by</b>${RF.esc(t.claimedBy || '—')}</span>
        <span><b>Opened</b>${RF.fmtDateTime(t.openedAt)}</span>
      </div>
      <div id="tagSection">${renderTagSection(t.tags)}</div>
      <div class="reason">${RF.esc(t.reason || 'No reason provided')}</div>
    </div>

    <div class="card log-card">
      <div class="log-scroll" id="logScroll"><div class="log">${logHtml}</div></div>

      <div class="compose">
        <div class="compose-row">
          <textarea id="composeText" placeholder="Message this ticket…" rows="1"></textarea>
          <button class="btn btn-accent" id="sendBtn">Send</button>
        </div>
        <div class="compose-meta">
          <input type="text" id="composeName" class="name-input" placeholder="Send as (your name)" maxlength="40">
          <span class="send-note">Posts to Discord labeled "via Website"</span>
        </div>
      </div>
    </div>
  `;

  document.getElementById('composeName').value = RF.getCookie('websiteSenderName') || '';
  document.getElementById('composeName').addEventListener('change', (e) => RF.setCookie('websiteSenderName', e.target.value.trim(), 90));

  document.getElementById('closeBtn').addEventListener('click', doClose);
  document.getElementById('sendBtn').addEventListener('click', doSend);
  document.getElementById('composeText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  });

  if (wasAtBottom) scrollToBottom();
}

function isScrolledToBottom() {
  const el = document.getElementById('logScroll');
  if (!el) return true;
  return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
}
function scrollToBottom() {
  const el = document.getElementById('logScroll');
  if (el) el.scrollTop = el.scrollHeight;
}

async function doSend() {
  const textEl = document.getElementById('composeText');
  const content = textEl.value.trim();
  if (!content) return;
  const asName = document.getElementById('composeName').value.trim();
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`/api/open-tickets/${encodeURIComponent(channelId)}/messages`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content, asName })
    });
    if (res.ok) { textEl.value = ''; load(); }
    else { const err = await res.json().catch(() => ({})); alert(err.error || 'Could not send — try again.'); }
  } catch { alert('Could not send — check your connection.'); }
  btn.disabled = false;
}

async function doClose() {
  if (!confirm('Close this ticket?')) return;
  const asName = document.getElementById('composeName').value.trim();
  const btn = document.getElementById('closeBtn');
  btn.disabled = true;
  btn.textContent = 'Closing…';
  try {
    const res = await fetch(`/api/open-tickets/${encodeURIComponent(channelId)}/close`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ asName })
    });
    if (res.ok) {
      if (pollTimer) clearInterval(pollTimer);
      document.getElementById('content').innerHTML = `<div class="card empty-state">✅ Closed — archiving now. <a href="/tickets" style="color:var(--accent)">Back to open tickets</a></div>`;
    } else {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Could not close — try again.');
      btn.disabled = false; btn.textContent = 'Close ticket';
    }
  } catch { alert('Could not close — check your connection.'); btn.disabled = false; btn.textContent = 'Close ticket'; }
}

(async function init() {
  initNav();
  await loadTagDefs();
  await load(false);
  pollTimer = setInterval(() => load(true), 6000);
})();
</script>
</body>
</html>
