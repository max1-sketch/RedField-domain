<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Live Ticket Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: {{ACCENT_COLOR}};
    --bg: #0b0d12;
    --panel: #131720;
    --panel-2: #1a1e2b;
    --border: #222735;
    --ink: #e3e6ed;
    --muted: #8891a0;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .btn-back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; }
  .btn-back:hover { color: var(--ink); }
  .ticket-title { font-size: 16px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 8px; }

  .ticket-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .status-pill.open { background: rgba(34, 197, 94, 0.12); color: var(--green); }
  .status-pill.closed { background: rgba(239, 68, 68, 0.12); color: var(--red); }

  .btn-group { display: flex; align-items: center; gap: 8px; }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { border-color: #3b4256; }
  .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

  /* Live Chat Workspace */
  .chat-layout { flex: 1; display: flex; overflow: hidden; }

  .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat-messages {
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg-row { display: flex; gap: 12px; align-items: flex-start; }
  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .msg-content { flex: 1; }
  .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .msg-author { font-weight: 700; color: var(--ink); }
  .msg-time { font-size: 11px; color: var(--muted); }
  .msg-body { color: #d1d7e0; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  /* Input Box */
  .chat-footer {
    padding: 16px 24px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; }
  .chat-input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }
  .chat-input:focus { border-color: var(--accent); }
  .btn-send { background: var(--accent); color: #000; font-weight: 700; padding: 0 18px; border: none; border-radius: 6px; cursor: pointer; }

  /* Side Info Drawer */
  .chat-sidebar {
    width: 280px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .side-section { margin-bottom: 20px; }
  .side-label { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .side-val { font-size: 13px; font-weight: 600; color: var(--ink); word-break: break-all; }
</style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="/tickets" class="btn-back">← Back to Open Tickets</a>
      <h1 class="ticket-title" id="ticketHeader">Live Ticket Channel</h1>
    </div>
    <div class="btn-group" id="headerActions">
      <button class="btn" id="claimBtn" onclick="toggleClaim(this)">Claim Ticket</button>
      <button class="btn btn-danger" onclick="closeTicket(this)">Close Ticket</button>
    </div>
  </header>

  <div class="chat-layout">
    <div class="chat-main">
      <div class="chat-messages" id="messageLog">
        <div style="text-align:center; color: var(--muted); padding: 40px;">Connecting to real-time chat server...</div>
      </div>

      <div class="chat-footer" id="chatFooterContainer">
        <form class="input-row" id="sendForm">
          <input type="text" class="chat-input" id="messageInput" placeholder="Type a message to send to Discord..." autocomplete="off">
          <button type="submit" class="btn-send">Send</button>
        </form>
      </div>
    </div>

    <div class="chat-sidebar">
      <div class="side-section">
        <div class="side-label">Opener</div>
        <div class="side-val" id="sideOpener">—</div>
      </div>
      <div class="side-section">
        <div class="side-label">Category / Type</div>
        <div class="side-val" id="sideType">—</div>
      </div>
      <div class="side-section">
        <div class="side-label">Claimed By</div>
        <div class="side-val" id="sideClaimed">—</div>
      </div>
      <div class="side-section">
        <div class="side-label">Reason Provided</div>
        <div class="side-val" id="sideReason" style="font-weight: 400; color: var(--muted);">—</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/theme.js"></script>
  <script>
    const channelId = window.location.pathname.split('/').pop();
    let socket = null;
    let isClaimed = false;

    async function initLiveChat() {
      try {
        // 1. Verify User Staff Role
        const meRes = await fetch('/api/me');
        if (!meRes.ok) return window.location.href = '/login';
        const user = await meRes.json();

        if (!user.isStaff) {
          // Lock message sending for non-staff members
          document.getElementById('chatFooterContainer').innerHTML = `
            <div style="text-align: center; color: var(--muted); font-size: 13px;">
              💬 To reply to this live ticket, please send messages directly inside your <strong>Discord server channel</strong>.
            </div>
          `;
          document.getElementById('headerActions').style.display = 'none';
        }

        // 2. Fetch Ticket Messages & Metadata
        const res = await fetch(`/api/open-tickets/${channelId}/messages`);
        if (!res.ok) throw new Error('Ticket is no longer open or accessible.');
        const data = await res.json();

        renderTicketMeta(data.ticket);
        renderMessages(data.messages);

        // 3. Connect Real-time Socket Engine
        socket = io();
        socket.emit('join_ticket', channelId);
        socket.on('ticket_message', (msg) => appendMessage(msg));

      } catch (err) {
        document.getElementById('messageLog').innerHTML = `<div style="text-align:center; color: var(--red); padding: 40px;">${RF.esc(err.message)}</div>`;
      }
    }

    function renderTicketMeta(ticket) {
      document.getElementById('ticketHeader').textContent = `#${ticket.userTag || channelId}`;
      document.getElementById('sideOpener').textContent = `@${ticket.userTag || 'Unknown'}`;
      document.getElementById('sideType').textContent = ticket.type || 'SUPPORT';
      document.getElementById('sideReason').textContent = ticket.reason || 'No reason provided';

      isClaimed = Boolean(ticket.claimedBy);
      document.getElementById('sideClaimed').textContent = ticket.claimedBy || 'Unclaimed';
      document.getElementById('claimBtn').textContent = isClaimed ? 'Unclaim Ticket' : 'Claim Ticket';
    }

    function renderMessages(messages) {
      const container = document.getElementById('messageLog');
      if (!messages.length) {
        container.innerHTML = `<div style="text-align:center; color: var(--muted); padding: 40px;">No messages sent in this channel yet.</div>`;
        return;
      }

      container.innerHTML = messages.map(m => createMsgHtml(m)).join('');
      scrollToBottom();
    }

    function createMsgHtml(m) {
      const initial = (m.author || 'U').charAt(0).toUpperCase();
      const timeStr = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      return `
        <div class="msg-row">
          <div class="msg-avatar">${initial}</div>
          <div class="msg-content">
            <div class="msg-header">
              <span class="msg-author">${RF.esc(m.author)}</span>
              <span class="msg-time">${timeStr}</span>
            </div>
            <div class="msg-body">${RF.esc(m.content)}</div>
          </div>
        </div>
      `;
    }

    function appendMessage(msg) {
      const container = document.getElementById('messageLog');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = createMsgHtml(msg);
      container.appendChild(msgDiv.firstElementChild);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('messageLog');
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('sendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;

      input.value = '';
      try {
        await fetch(`/api/open-tickets/${channelId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
      } catch (err) {
        RF.toast('Failed to send message: ' + err.message, false);
      }
    });

    async function toggleClaim(btn) {
      const targetBtn = btn || document.getElementById('claimBtn');
      await RF.withLoader(targetBtn, async () => {
        const endpoint = isClaimed ? `/api/open-tickets/${channelId}/unclaim` : `/api/open-tickets/${channelId}/claim`;
        const res = await fetch(endpoint, { method: 'POST' });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Failed to update claim status');
        }
        const data = await res.json();
        isClaimed = !isClaimed;
        document.getElementById('sideClaimed').textContent = isClaimed ? (data.claimedBy || 'Staff') : 'Unclaimed';
        document.getElementById('claimBtn').textContent = isClaimed ? 'Unclaim Ticket' : 'Claim Ticket';
      }, isClaimed ? 'Ticket unclaimed' : 'Ticket claimed!');
    }

    async function closeTicket(btn) {
      const targetBtn = btn || document.querySelector('.btn-danger');
      await RF.withLoader(targetBtn, async () => {
        const res = await fetch(`/api/open-tickets/${channelId}/close`, { method: 'POST' });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Could not close ticket');
        }
        window.location.href = '/tickets';
      }, 'Ticket closed');
    }

    initLiveChat();
  </script>
</body>
</html>
