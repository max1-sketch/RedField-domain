<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — My Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: {{ACCENT_COLOR}};
    --bg: #0b0d12;
    --panel: #131720;
    --border: #222735;
    --ink: #e3e6ed;
    --muted: #8891a0;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
  
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 5%; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 16px; font-weight: 800; text-decoration: none; color: inherit; }
  
  .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; }
  
  table.dense-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table.dense-table th { text-align: left; padding: 12px 16px; color: var(--muted); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  table.dense-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--ink); }
  table.dense-table tr:last-child td { border-bottom: none; }

  .badge-status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .badge-status.open { background: rgba(34, 197, 94, 0.15); color: var(--green); }
  .badge-status.closed { background: rgba(136, 145, 160, 0.15); color: var(--muted); }

  .btn-view { color: var(--accent); text-decoration: none; font-weight: 600; }
  .btn-view:hover { text-decoration: underline; }
</style>
</head>
<body>

  <header>
    <a href="/" class="brand">← Back to {{SITE_TITLE}} Hub</a>
    <div id="userTag" style="color: var(--muted); font-weight: 600;"></div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>My Support Tickets</h1>
    </div>

    <table class="dense-table">
      <thead>
        <tr>
          <th>Ticket ID</th>
          <th>Category</th>
          <th>Status</th>
          <th>Opened</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ticketRows">
        <tr><td colspan="5" style="text-align:center; color: var(--muted);">Loading ticket history...</td></tr>
      </tbody>
    </table>

    {{FOOTER_NOTE_HTML}}
  </div>

  <script src="/theme.js"></script>
  <script>
    async function loadTickets() {
      try {
        const meRes = await fetch('/api/me');
        if (!meRes.ok) return window.location.href = '/login';
        const user = await meRes.json();
        document.getElementById('userTag').textContent = `@${user.tag}`;

        const res = await fetch('/api/user/tickets');
        if (!res.ok) throw new Error('Failed to load tickets');
        const tickets = await res.json();

        const tbody = document.getElementById('ticketRows');
        if (!tickets.length) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--muted); padding: 30px;">You have no active or previous support tickets.</td></tr>`;
          return;
        }

        tbody.innerHTML = tickets.map(t => `
          <tr>
            <td style="font-family: monospace;">#${RF.esc(t.id.slice(-6))}</td>
            <td>${RF.esc(t.type || 'SUPPORT')}</td>
            <td><span class="badge-status ${t.closedAt ? 'closed' : 'open'}">${t.closedAt ? 'Closed' : 'Open'}</span></td>
            <td>${t.openedAt ? new Date(t.openedAt).toLocaleDateString() : '—'}</td>
            <td><a href="/transcript/${t.id}" class="btn-view">View Transcript →</a></td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('ticketRows').innerHTML = `<tr><td colspan="5" style="text-align:center; color: #ef4444;">${RF.esc(err.message)}</td></tr>`;
      }
    }
    loadTickets();
  </script>
</body>
</html>
