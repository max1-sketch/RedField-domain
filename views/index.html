<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — Archive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --accent-dim: color-mix(in srgb, {{ACCENT_COLOR}} 55%, #000000);
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; background: var(--bg-0); color: var(--ink);
  font-family: 'Inter', sans-serif; font-size: 14px;
}
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }

.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

/* ---------- shell ---------- */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px; flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 18px 14px; display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: #0a0c11;
  padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px;
  margin-bottom: 18px; line-height: 1.25;
}
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }

nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; border-radius: 8px;
  color: var(--muted); font-size: 13.5px; font-weight: 500;
}
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1400px; }

.page-title { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 20px; }

/* ---------- card ---------- */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.card-header h2 { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0; }
.card-sub { font-size: 12.5px; color: var(--muted); margin: -10px 0 16px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px; padding: 9px 15px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-accent { background: var(--accent); color: #0a0c11; }
.btn-accent:hover { opacity: .9; }
.btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- inputs ---------- */
input[type=text], select {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 9px 12px; border-radius: 7px; font-family: inherit; font-size: 13px;
}
input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }

/* ---------- filters row ---------- */
.filters-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 4px; }
.search-wrap { position: relative; flex: 1 1 260px; min-width: 200px; }
.search-wrap input { width: 100%; padding-left: 32px; }
.search-wrap::before { content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 15px; }
.count-pill { font-size: 12px; color: var(--faint); white-space: nowrap; margin-left: auto; }
.count-pill b { color: var(--accent); font-weight: 700; }

.stats-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.stat-chip { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 7px 13px; border-radius: 8px; }
.stat-chip b { color: var(--ink); font-weight: 700; margin-left: 4px; }
.stat-chip.total { border-color: var(--accent); color: var(--accent); }

/* ---------- table ---------- */
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--faint); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td { padding: 13px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
.cell-main { color: var(--ink); font-weight: 600; }
.cell-sub { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.cell-muted { color: var(--muted); }

.type-badge {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
  padding: 3px 9px; border-radius: 5px; text-transform: uppercase;
}
.tag-chip-row { display: flex; flex-wrap: wrap; gap: 5px; max-width: 220px; }
.tag-chip { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.actions-cell { display: flex; gap: 8px; justify-content: flex-end; }

.empty-row td { text-align: center; padding: 50px 20px; color: var(--faint); }
.empty-row .icon { font-size: 22px; margin-bottom: 8px; display: block; }
.empty-row h3 { font-size: 14px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.empty-row p { font-size: 12.5px; margin: 0; }

.skeleton-row td { color: var(--faint); opacity: .4; animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .5; } }

/* ---------- modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,6,9,.75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 340px; max-width: 100%; }
.modal h3 { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
.modal p { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; line-height: 1.6; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; justify-content: center; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session --:--</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <h1 class="page-title">Ticket Archive</h1>

    <div class="stats-row" id="statsRow" style="display:none;"></div>

    <div class="card">
      <div class="filters-row">
        <div class="search-wrap">
          <input id="search" type="text" placeholder="Search opener, claimer, reason…" autocomplete="off">
        </div>
        <select id="typeFilter"><option value="">All types</option></select>
        <select id="tagFilter"><option value="">All tags</option></select>
        <select id="sortOrder">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <span class="count-pill" id="countPill">loading…</span>
      </div>
    </div>

    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Ticket</th>
            <th>Opened by</th>
            <th>Claimed by</th>
            <th>Closed</th>
            <th>Tags</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="skeleton-row"><td colspan="7">Loading archive…</td></tr>
        </tbody>
      </table>
    </div>

    {{FOOTER_NOTE_HTML}}
  </main>
</div>

<div class="modal-overlay" id="deleteOverlay">
  <div class="modal">
    <h3>Delete this record?</h3>
    <p>This permanently removes the archived transcript from the site. Can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-danger" id="confirmDelete">Delete it</button>
      <button class="btn btn-ghost" id="cancelDelete">Never mind</button>
    </div>
  </div>
</div>

<script>
window.RF = (function () {
  const TYPE_COLORS = { REDFIELD: '#22c55e', MANAGEMENT: '#3b82f6', BUG: '#f59e0b' };
  const FALLBACK_COLOR = '#a78bfa';
  function typeColor(type) { return TYPE_COLORS[type] || FALLBACK_COLOR; }
  function esc(str) {
    return (str === undefined || str === null ? '' : String(str))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(tag) { if (!tag) return '?'; return tag.split('#')[0].slice(0, 2).toUpperCase(); }
  function fmtDateTime(iso) {
    if (!iso) return 'Unknown';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return 'Unknown';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function fmtDay(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return 'Unknown date';
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function fmtTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function isStaffSession() { return Boolean(getCookie('ticketAuth')); }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(new Error('copy failed')); }
      catch (err) { reject(err); } finally { document.body.removeChild(ta); }
    });
  }
  function startSessionClock(el) {
    function tick() {
      const expiresAt = parseInt(getCookie('sessionExpires') || '0', 10);
      if (!expiresAt) { el.textContent = 'session --:--'; return; }
      const remaining = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
      const m = Math.floor(remaining / 60), s = remaining % 60;
      el.textContent = `session ${m}:${s.toString().padStart(2, '0')}`;
      el.classList.toggle('warn', remaining <= 60);
      if (remaining <= 0) window.location.reload();
    }
    tick(); setInterval(tick, 1000);
  }
  const ICONS = {
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5Z"></path></svg>',
  archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>',
  tickets: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-5l-2 3h-4l-2-3H2"></path><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1Z"></path></svg>',
  panels: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>',
  tags: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H3v9l10.3 10.3a1 1 0 0 0 1.4 0l7.6-7.6a1 1 0 0 0 0-1.4L12 2Z"></path><circle cx="7.5" cy="7.5" r="1.4"></circle></svg>',
  quickwords: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
  feedback: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
  audit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>',
  blacklist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m5.5 5.5 13 13"></path></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>',
  logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>'
};

function renderNav(activePath) {
  const tabs = [
    { href: '/', label: 'Archive', ic: ICONS.archive },
    { href: '/tickets', label: 'Open Tickets', ic: ICONS.tickets },
    { href: '/panels', label: 'Panels', ic: ICONS.panels },
    { href: '/tags', label: 'Tags', ic: ICONS.tags },
    { href: '/quickwords', label: 'Quick Words', ic: ICONS.quickwords },
    { href: '/feedback', label: 'Feedback', ic: ICONS.feedback },
    { href: '/audit-log', label: 'Audit Log', ic: ICONS.audit },
    { href: '/moderation', label: 'Moderation', ic: ICONS.shield },
    { href: '/blacklist', label: 'Blacklist', ic: ICONS.blacklist },
    { href: '/settings', label: 'Settings', ic: ICONS.settings }
  ];
  return tabs.map(t => `<a class="nav-item${t.href === activePath ? ' active' : ''}" href="${t.href}"><span class="ic">${t.ic}</span> ${t.label}</a>`).join('');
}
  return { typeColor, esc, initials, fmtDateTime, fmtDay, fmtTime, getCookie, isStaffSession, copyText, startSessionClock, renderNav, ICONS };
})();

document.getElementById('navTabs').innerHTML = RF.renderNav('/');
const _logoutIconEl = document.getElementById('logoutIcon'); if (_logoutIconEl) _logoutIconEl.innerHTML = RF.ICONS.logout;
RF.startSessionClock(document.getElementById('sessionClock'));

let allTickets = [];
let allTags = [];
let pendingDeleteId = null;

async function loadTags() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const data = await res.json();
      allTags = data.tags || [];
      const sel = document.getElementById('tagFilter');
      for (const t of allTags) {
        const opt = document.createElement('option');
        opt.value = t.id; opt.textContent = t.name;
        sel.appendChild(opt);
      }
    }
  } catch { /* tag filter stays empty if failed */ }
}

function tagById(id) { return allTags.find(t => t.id === id); }

async function loadTickets() {
  try {
    const res = await fetch('/api/tickets');
    if (res.status === 401) {
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">🔒</span><h3>Session expired</h3><p><a href="/" style="color:var(--accent)">Log in again</a></p></td></tr>`;
      return;
    }
    if (!res.ok) {
      let bodyText = '';
      try { bodyText = await res.text(); } catch {}
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">⚠</span><h3>Server error</h3><p>HTTP ${res.status}${bodyText ? ' — ' + RF.esc(bodyText.slice(0, 200)) : ''}</p></td></tr>`;
      document.getElementById('countPill').textContent = `error ${res.status}`;
      return;
    }
    allTickets = await res.json();
    if (!Array.isArray(allTickets)) throw new Error('Unexpected response shape');
    populateTypeFilter();
    render();
  } catch (err) {
    document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">⚠</span><h3>Couldn't load the archive</h3><p>${RF.esc(err.message || 'Unknown error')}</p></td></tr>`;
    document.getElementById('countPill').textContent = 'failed to load';
  }
}

function populateTypeFilter() {
  const types = [...new Set(allTickets.map(t => t.type).filter(Boolean))].sort();
  const sel = document.getElementById('typeFilter');
  for (const t of types) {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  }
}

function renderStats(list) {
  const row = document.getElementById('statsRow');
  if (!list.length) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  const byType = {};
  for (const t of list) byType[t.type || 'OTHER'] = (byType[t.type || 'OTHER'] || 0) + 1;
  const chips = Object.entries(byType).sort((a, b) => b[1] - a[1])
    .map(([type, count]) => `<span class="stat-chip" style="border-color:${RF.typeColor(type)}55">${count} <b>${RF.esc(type)}</b></span>`).join('');
  row.innerHTML = `<span class="stat-chip total">${list.length} <b>shown</b></span>${chips}`;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const typeFilter = document.getElementById('typeFilter').value;
  const tagFilter = document.getElementById('tagFilter').value;
  const sort = document.getElementById('sortOrder').value;

  let filtered = allTickets.filter(t => {
    if (typeFilter && t.type !== typeFilter) return false;
    if (tagFilter && !(Array.isArray(t.tags) && t.tags.includes(tagFilter))) return false;
    if (!q) return true;
    const haystack = [t.openedBy, t.claimedBy, t.closedBy, t.reason, t.robloxUsername, t.channelName].join(' ').toLowerCase();
    return haystack.includes(q);
  });
  filtered.sort((a, b) => {
    const da = new Date(a.closedAt || 0).getTime();
    const db = new Date(b.closedAt || 0).getTime();
    return sort === 'oldest' ? da - db : db - da;
  });

  document.getElementById('countPill').innerHTML = `<b>${filtered.length}</b> of ${allTickets.length} filed`;
  renderStats(filtered);

  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7"><span class="icon">🗄️</span><h3>${allTickets.length ? 'No matches' : 'Nothing filed yet'}</h3><p>${allTickets.length ? 'Try a different search or type filter.' : 'Closed tickets will show up here once staff archive them.'}</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(t => {
    const color = RF.typeColor(t.type);
    const tagChips = (Array.isArray(t.tags) ? t.tags : []).map(tagId => {
      const tag = tagById(tagId);
      if (!tag) return '';
      return `<span class="tag-chip" style="background:${tag.color}22; color:${tag.color};">${RF.esc(tag.name)}</span>`;
    }).join('');
    return `
    <tr>
      <td><span class="type-badge" style="background:${color}22; color:${color};">${RF.esc(t.type || 'TICKET')}</span></td>
      <td>
        <div class="cell-main">${RF.esc(t.channelName || 'unnamed-ticket')}</div>
        <div class="cell-sub mono">#${RF.esc((t.id || '').slice(-6))}</div>
      </td>
      <td class="cell-muted">${RF.esc(t.openedBy || 'Unknown')}</td>
      <td class="cell-muted">${RF.esc(t.claimedBy || '—')}</td>
      <td class="cell-muted">${RF.fmtDateTime(t.closedAt)}</td>
      <td><div class="tag-chip-row">${tagChips || '<span class="cell-muted" style="font-size:11.5px;">—</span>'}</div></td>
      <td>
        <div class="actions-cell">
          <a class="btn btn-accent" href="/transcript/${encodeURIComponent(t.id)}">Open</a>
          <button class="btn btn-danger" data-id="${RF.esc(t.id)}" onclick="askDelete(this)">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function askDelete(btn) {
  pendingDeleteId = btn.getAttribute('data-id');
  document.getElementById('deleteOverlay').classList.add('show');
}
document.getElementById('cancelDelete').addEventListener('click', () => {
  pendingDeleteId = null;
  document.getElementById('deleteOverlay').classList.remove('show');
});
document.getElementById('confirmDelete').addEventListener('click', async () => {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  document.getElementById('deleteOverlay').classList.remove('show');
  try {
    const res = await fetch(`/api/tickets/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (res.ok) { allTickets = allTickets.filter(t => t.id !== id); render(); }
    else alert('Could not delete — try refreshing the page.');
  } catch { alert('Could not delete — check your connection.'); }
  pendingDeleteId = null;
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('tagFilter').addEventListener('change', render);
document.getElementById('sortOrder').addEventListener('change', render);

loadTags().then(loadTickets);
</script>
</body>
</html>
