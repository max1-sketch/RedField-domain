<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE_TITLE}} — User Lookup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --accent: {{ACCENT_COLOR}};
  --accent-dim: color-mix(in srgb, {{ACCENT_COLOR}} 55%, #000000);
  --bg-0: #0a0c11;
  --sidebar-bg: #0d0f16;
  --panel: #141722;
  --panel-2: #1a1e2b;
  --border: #262b3a;
  --ink: #e7e9ee;
  --muted: #9199a8;
  --faint: #5b6272;
  --red: #ef4444;
  --green: #22c55e;
  --amber: #f59e0b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; background: var(--bg-0); color: var(--ink);
  font-family: 'Inter', sans-serif; font-size: 14px;
}
a { color: inherit; text-decoration: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }

.site-banner { background: var(--accent); color: #0a0c11; font-weight: 700; font-size: 12.5px; text-align: center; padding: 9px 16px; }

/* ---------- shell ---------- */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px; flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 18px 14px; display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: #0a0c11;
  padding: 13px 15px; border-radius: 10px; font-weight: 800; font-size: 14.5px;
  margin-bottom: 18px; line-height: 1.25;
}
.sidebar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #0a0c11; flex-shrink: 0; opacity: .55; }

nav.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; border-radius: 8px;
  color: var(--muted); font-size: 13.5px; font-weight: 500;
}
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent); color: #0a0c11; font-weight: 700; }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; opacity: .85; }
.nav-item .ic svg { width: 100%; height: 100%; }
.nav-item.active .ic { opacity: 1; }

.badge-beta { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: auto; text-transform: uppercase; }

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.session-line { padding: 0 13px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }
.session-line.warn { color: var(--red); }

.content-area { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1000px; }

.page-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.page-sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; }

/* ---------- search box ---------- */
.search-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
.mode-toggle { display: flex; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); padding: 4px; border-radius: 8px; width: fit-content; margin-bottom: 14px; }
.type-btn { background: transparent; border: none; color: var(--muted); padding: 7px 16px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s; }
.type-btn.active { background: var(--accent); color: #0a0c11; font-weight: 700; }

.search-row { display: flex; gap: 10px; }
.search-card input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink); padding: 11px 16px; border-radius: 8px; font-family: inherit; font-size: 13.5px; }
.search-card input:focus { outline: none; border-color: var(--accent); }
.btn-search { background: var(--accent); color: #0a0c11; border: none; border-radius: 8px; padding: 0 22px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn-search:hover { opacity: .9; }

/* ---------- profile results ---------- */
.profile-grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; display: none; }
.profile-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.avatar-wrap { position: relative; margin-bottom: 14px; }
.avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; background: var(--panel-2); border: 2px solid var(--border); }
.platform-badge { position: absolute; bottom: 0; right: 0; background: var(--panel-2); border: 1px solid var(--border); padding: 4px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; }

.user-name { font-size: 17px; font-weight: 800; margin: 0 0 2px; color: var(--ink); }
.user-meta { font-size: 11.5px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; margin-bottom: 16px; }

.role-chip-container { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; margin-top: 10px; }
.role-chip { font-size: 11px; padding: 4px 10px; border-radius: 99px; font-weight: 600; border: 1px solid transparent; }

.detail-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
.section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
.stat-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
.stat-label { font-size: 11px; color: var(--muted); font-weight: 500; }

.history-list { font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
.history-item { background: var(--panel-2); border: 1px solid var(--border); padding: 12px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
.history-item .t-info b { color: var(--ink); }
.history-item .t-info span { font-size: 11.5px; color: var(--faint); display: block; margin-top: 2px; }

.empty-history { text-align: center; padding: 30px; color: var(--faint); font-size: 13px; }

.btn-open { background: var(--accent); color: #0a0c11; font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 6px; }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 18px 16px 50px; }
  .profile-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

{{BANNER_HTML}}

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>{{SITE_TITLE}}</div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div class="sidebar-footer">
      <span class="session-line mono" id="sessionClock">session active</span>
      <a href="/logout" class="nav-item"><span class="ic" id="logoutIcon"></span> Log out</a>
    </div>
  </aside>

  <main class="content-area">
    <h1 class="page-title">User Lookup <span class="badge-beta">BETA</span></h1>
    <p class="page-sub">Search Discord or Roblox members to inspect support history and profiles.</p>
    
    <div class="search-card">
      <div class="mode-toggle">
        <button class="type-btn active" id="modeDiscord" onclick="setMode('discord')">Discord Member</button>
        <button class="type-btn" id="modeRoblox" onclick="setMode('roblox')">Roblox Account</button>
      </div>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Enter Discord User ID or @Username..." autocomplete="off" />
        <button class="btn-search" id="searchBtn" onclick="performLookup()">Search</button>
      </div>
    </div>

    <div class="profile-grid" id="resultGrid">
      <div class="profile-card">
        <div class="avatar-wrap">
          <img class="avatar" id="uAvatar" src="" alt="Avatar" />
          <span class="platform-badge" id="platformBadge">DISCORD</span>
        </div>
        <div class="user-name" id="uTag"></div>
        <div class="user-meta mono" id="uId"></div>
        <div class="role-chip-container" id="uRoles"></div>
      </div>

      <div class="detail-card">
        <div class="section-title">Support Activity Overview</div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-num" id="sOpen">0</div><div class="stat-label">Active Tickets</div></div>
          <div class="stat-box"><div class="stat-num" id="sArch">0</div><div class="stat-label">Closed Transcripts</div></div>
          <div class="stat-box"><div class="stat-num" id="sNotes">0</div><div class="stat-label">Mod Notes</div></div>
        </div>

        <div class="section-title">Ticket &amp; Support History</div>
        <div class="history-list" id="hTickets">
          <div class="empty-history">No tickets recorded.</div>
        </div>
      </div>
    </div>

    {{FOOTER_NOTE_HTML}}
  </main>
</div>

<script src="/theme.js"></script>
<script>
RF.startSessionClock(document.getElementById('sessionClock'));

let searchMode = 'discord';

function setMode(mode) {
  searchMode = mode;
  document.getElementById('modeDiscord').classList.toggle('active', mode === 'discord');
  document.getElementById('modeRoblox').classList.toggle('active', mode === 'roblox');
  document.getElementById('searchInput').placeholder = mode === 'discord' 
    ? 'Enter Discord User ID or @Username...' 
    : 'Enter Roblox Username or Numeric ID...';
  document.getElementById('resultGrid').style.display = 'none';
}

async function performLookup() {
  let query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  // Strip leading '@' if typed by user
  if (query.startsWith('@')) query = query.slice(1);

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'Searching...';

  try {
    if (searchMode === 'roblox') {
      await performRobloxLookup(query);
    } else {
      await performDiscordLookup(query);
    }
  } catch (err) {
    alert(err.message || 'Lookup failed.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

async function performDiscordLookup(query) {
  const res = await fetch(`/api/lookup/${encodeURIComponent(query)}`);
  if (!res.ok) throw new Error('Discord member not found in server.');
  
  const data = await res.json();
  const u = data.user;

  document.getElementById('platformBadge').textContent = 'DISCORD';
  document.getElementById('platformBadge').style.color = '#3b82f6';
  document.getElementById('uAvatar').src = u.avatarURL || 'https://cdn.discordapp.com/embed/avatars/0.png';
  document.getElementById('uTag').textContent = u.displayName || u.tag;
  document.getElementById('uId').textContent = `@${u.tag} • ${u.id}`;
  
  document.getElementById('uRoles').innerHTML = (u.roles || []).map(r => 
    `<span class="role-chip" style="background:${r.color}15; color:${r.color}; border-color:${r.color}33;">${RF.esc(r.name)}</span>`
  ).join('');

  document.getElementById('sOpen').textContent = data.ticketStats?.openCount || 0;
  document.getElementById('sArch').textContent = data.ticketStats?.archiveCount || 0;
  document.getElementById('sNotes').textContent = (data.notes || []).length;

  const archives = data.ticketStats?.archives || [];
  document.getElementById('hTickets').innerHTML = archives.length 
    ? archives.map(a => `
        <div class="history-item">
          <div class="t-info">
            <b>${RF.esc(a.type || 'TICKET')} Ticket</b>
            <span>Closed on ${new Date(a.closedAt).toLocaleDateString()}</span>
          </div>
          <a class="btn-open" href="/transcript/${a.id}?token=${a.accessToken}" target="_blank">View Transcript</a>
        </div>
      `).join('')
    : '<div class="empty-history">No past support tickets found for this user.</div>';

  document.getElementById('resultGrid').style.display = 'grid';
}

async function performRobloxLookup(query) {
  const res = await fetch(`/api/roblox/lookup/${encodeURIComponent(query)}`);
  
  if (!res.ok) {
    // If backend direct search throws, fallback cleanly to direct Web Profile
    const isId = !isNaN(query);
    const fallbackId = isId ? query : null;
    
    document.getElementById('platformBadge').textContent = 'ROBLOX';
    document.getElementById('platformBadge').style.color = '#ef4444';
    document.getElementById('uAvatar').src = 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Placeholder';
    document.getElementById('uTag').textContent = query;
    document.getElementById('uId').textContent = isId ? `Roblox ID: ${query}` : `Roblox Username: ${query}`;
    
    document.getElementById('uRoles').innerHTML = fallbackId 
      ? `<a href="https://www.roblox.com/users/${fallbackId}/profile" target="_blank" style="color:var(--accent); font-weight:700;">Open Profile on Roblox.com ↗</a>`
      : `<span style="color:var(--faint);">Search via Roblox Website</span>`;

    document.getElementById('sOpen').textContent = '-';
    document.getElementById('sArch').textContent = '-';
    document.getElementById('sNotes').textContent = '-';
    document.getElementById('hTickets').innerHTML = `
      <div class="history-item">
        <div class="t-info">
          <b>Roblox Profile Lookup</b>
          <span>Could not resolve automatically via Roblox API.</span>
        </div>
        <a class="btn-open" href="https://www.roblox.com/search/users?keyword=${encodeURIComponent(query)}" target="_blank">Search on Roblox ↗</a>
      </div>`;
      
    document.getElementById('resultGrid').style.display = 'grid';
    return;
  }

  const data = await res.json();
  document.getElementById('platformBadge').textContent = 'ROBLOX';
  document.getElementById('platformBadge').style.color = '#ef4444';
  document.getElementById('uAvatar').src = data.avatarUrl || 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Placeholder';
  document.getElementById('uTag').textContent = data.username;
  document.getElementById('uId').textContent = `Roblox ID: ${data.id}`;
  
  document.getElementById('uRoles').innerHTML = `
    <a href="https://www.roblox.com/users/${data.id}/profile" target="_blank" style="color:var(--accent); font-weight:700; font-size:12px;">
      View Profile on Roblox.com ↗
    </a>`;

  document.getElementById('sOpen').textContent = '-';
  document.getElementById('sArch').textContent = '-';
  document.getElementById('sNotes').textContent = '-';
  document.getElementById('hTickets').innerHTML = `
    <div class="history-item">
      <div class="t-info">
        <b>Direct Roblox Account Found</b>
        <span>Roblox accounts are verified via ticket transcripts or linked tags.</span>
      </div>
      <a class="btn-open" href="https://www.roblox.com/users/${data.id}/profile" target="_blank">Roblox Profile ↗</a>
    </div>`;

  document.getElementById('resultGrid').style.display = 'grid';
}

document.getElementById('searchInput').addEventListener('keypress', e => { 
  if (e.key === 'Enter') performLookup(); 
});

async function initNav() {
  try {
    const res = await fetch('/api/guild');
    if (res.ok) {
      const g = await res.json();
      const allowedTabs = g.viewerTier === 'staff' ? g.staffPermissions?.allowedTabs : null;
      document.getElementById('navTabs').innerHTML = RF.renderNav('/lookup', allowedTabs);
    } else {
      document.getElementById('navTabs').innerHTML = RF.renderNav('/lookup', null);
    }
  } catch {
    document.getElementById('navTabs').innerHTML = RF.renderNav('/lookup', null);
  }

  const logoutIconEl = document.getElementById('logoutIcon');
  if (logoutIconEl && RF.ICONS?.logout) logoutIconEl.innerHTML = RF.ICONS.logout;
}

initNav();
</script>
</body>
</html>
